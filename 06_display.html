<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Invaders — Live Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint:     #00FFAF;
      --mint-dim: rgba(0,255,175,0.15);
      --mint-glow:rgba(0,255,175,0.35);
      --gold:     #FFD700;
      --silver:   #C0C0C0;
      --bronze:   #CD7F32;
      --bg:       #000;
      --panel:    #080808;
      --border:   #1a1a1a;
      --text:     #ffffff;
      --dim:      #555;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      overflow: hidden;
    }

    /* ── STARFIELD ── */
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; }
      50%      { opacity: 0.7; }
    }

    /* ── SCANLINES ── */
    .scanlines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
      );
    }

    /* ── GRID LAYOUT ── */
    .display {
      position: relative; z-index: 1;
      width: 100vw; height: 100dvh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: 1fr;
      gap: 0;
    }

    /* ══════════════════════════════
       LEFT PANEL
    ══════════════════════════════ */
    .left-panel {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 32px;
      gap: 32px;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: "";
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom,
        transparent, var(--mint), transparent);
    }

    /* Glow blob behind logo */
    .left-panel::after {
      content: "";
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,255,175,0.06) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo-wrap {
      width: 120px; height: 98px;
      animation: logoGlow 3s ease-in-out infinite;
      position: relative; z-index: 1;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 12px var(--mint)); }
      50%      { filter: drop-shadow(0 0 32px var(--mint)); }
    }

    .game-title {
      text-align: center;
      position: relative; z-index: 1;
    }
    .game-title-main {
      font-size: 32px; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      line-height: 1.1;
    }
    .game-title-main span { color: var(--mint); }
    .game-title-sub {
      font-size: 10px; letter-spacing: 0.4em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      margin-top: 8px; text-transform: uppercase;
    }

    /* LIVE indicator */
    .live-badge {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,255,175,0.06);
      border: 1px solid rgba(0,255,175,0.2);
      border-radius: 100px;
      padding: 10px 20px;
      position: relative; z-index: 1;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--mint);
      animation: livePulse 1.5s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,175,0.4); }
      50%      { opacity: 0.4; box-shadow: 0 0 0 6px transparent; }
    }
    .live-text {
      font-size: 11px; letter-spacing: 0.4em;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    /* Player count */
    .stat-block {
      text-align: center;
      position: relative; z-index: 1;
    }
    .stat-num {
      font-size: 56px; font-weight: 900;
      color: var(--mint); letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 0 40px var(--mint-glow);
    }
    .stat-label {
      font-size: 9px; letter-spacing: 0.4em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase; margin-top: 6px;
    }

    /* ── TIMER BLOCK ── */
    .timer-block {
      text-align: center;
      position: relative; z-index: 1;
      width: 100%;
    }
    .btn-start {
      width: 100%; padding: 16px 0;
      background: var(--mint); color: #000;
      border: none; border-radius: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 14px; font-weight: 900;
      letter-spacing: 0.3em; text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(0,255,175,0.4);
    }
    .btn-start:hover { transform: scale(1.03); box-shadow: 0 0 40px rgba(0,255,175,0.6); }
    .btn-start:active { transform: scale(0.97); }
    .timer-display { display: none; }
    .timer-display.active { display: block; }
    .timer-digits {
      font-size: 72px; font-weight: 900;
      letter-spacing: -0.02em; line-height: 1;
      color: var(--mint);
      text-shadow: 0 0 40px var(--mint-glow);
      transition: color 0.3s;
    }
    .timer-digits.warning { color: #ff4444; text-shadow: 0 0 40px rgba(255,68,68,0.5); }
    .timer-label {
      font-size: 9px; letter-spacing: 0.4em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase; margin-top: 6px;
    }
    .timer-bar-wrap {
      width: 100%; height: 4px;
      background: #1a1a1a; border-radius: 2px;
      margin-top: 12px; overflow: hidden;
    }
    .timer-bar {
      height: 100%; border-radius: 2px;
      background: var(--mint);
      transition: width 1s linear, background 0.3s;
      width: 100%;
    }
    .timer-bar.warning { background: #ff4444; }
    .frozen-badge {
      display: none;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 10px; letter-spacing: 0.35em;
      color: var(--gold); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }
    .frozen-badge.visible { display: block; }
    .confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 100;
    }
    .board-frozen-label {
      display: none;
      font-size: 10px; letter-spacing: 0.4em;
      color: var(--gold); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }
    .board-frozen-label.visible { display: block; }

    /* QR / scan hint */
    .scan-hint {
      text-align: center;
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding-top: 24px; width: 100%;
    }
    .scan-hint-text {
      font-size: 9px; letter-spacing: 0.3em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase; line-height: 1.8;
    }
    .scan-hint-url {
      font-size: 11px; letter-spacing: 0.15em;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      margin-top: 6px;
    }

    /* ══════════════════════════════
       RIGHT PANEL — LEADERBOARD
    ══════════════════════════════ */
    .right-panel {
      display: flex; flex-direction: column;
      padding: 40px 48px;
      gap: 0;
      overflow: hidden;
    }

    .board-header {
      display: flex; align-items: baseline;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .board-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.5em; color: var(--dim);
      text-transform: uppercase;
      font-family: "Share Tech Mono", monospace;
    }

    .update-indicator {
      font-size: 10px; letter-spacing: 0.2em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      display: flex; align-items: center; gap: 8px;
    }
    .update-indicator.flash { color: var(--mint); }

    /* ROWS */
    .board-list {
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: space-around;
      gap: 0;
    }

    .player-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      padding: 14px 20px;
      border-radius: 12px;
      position: relative;
      transition: background 0.4s ease, transform 0.4s ease;
      border: 1px solid transparent;
      border-left: 4px solid transparent;
    }

    /* Разделитель между топ-3 и остальными */
    .player-row.rank-separator {
      margin-top: 16px;
      border-top: 1px solid #1a1a1a;
    }

    .player-row.rank-1 {
      background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,215,0,0.06));
      border-color: rgba(255,215,0,0.35);
      border-left-color: var(--gold);
      box-shadow: inset 0 0 40px rgba(255,215,0,0.04), 0 0 20px rgba(255,215,0,0.08);
    }
    .player-row.rank-2 {
      background: linear-gradient(135deg, rgba(192,192,192,0.14), rgba(192,192,192,0.04));
      border-color: rgba(192,192,192,0.3);
      border-left-color: var(--silver);
      box-shadow: inset 0 0 40px rgba(192,192,192,0.03);
    }
    .player-row.rank-3 {
      background: linear-gradient(135deg, rgba(205,127,50,0.14), rgba(205,127,50,0.04));
      border-color: rgba(205,127,50,0.3);
      border-left-color: var(--bronze);
      box-shadow: inset 0 0 40px rgba(205,127,50,0.03);
    }

    /* Rank number */
    .row-rank {
      font-size: 22px; font-weight: 900;
      text-align: center; line-height: 1;
    }
    .rank-1 .row-rank { font-size: 36px; }
    .rank-2 .row-rank { font-size: 30px; }
    .rank-3 .row-rank { font-size: 28px; }
    .row-rank-num { color: #333; font-size: 20px; }

    /* Name */
    .row-name {
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 20px;
    }
    .rank-1 .row-name { font-size: 34px; color: var(--gold); }
    .rank-2 .row-name { font-size: 30px; color: var(--silver); }
    .rank-3 .row-name { font-size: 28px; color: var(--bronze); }

    /* Score */
    .row-score {
      font-size: 28px; font-weight: 700;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      letter-spacing: 0.02em; text-align: right;
      white-space: nowrap;
    }
    .rank-1 .row-score {
      font-size: 36px; color: var(--gold);
      text-shadow: 0 0 24px rgba(255,215,0,0.5);
    }
    .rank-2 .row-score {
      font-size: 32px; color: var(--silver);
    }
    .rank-3 .row-score {
      font-size: 30px; color: var(--bronze);
    }
    .row-score-pts {
      font-size: 11px; letter-spacing: 0.2em;
      color: var(--dim); display: block;
      font-family: "Share Tech Mono", monospace;
      text-align: right; margin-top: 2px;
    }

    /* Empty / loading states */
    .board-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }
    .board-empty-icon {
      font-size: 48px; opacity: 0.3;
    }
    .board-empty-text {
      font-size: 12px; letter-spacing: 0.4em;
      color: var(--dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }
    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid #222;
      border-top-color: var(--mint);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Row entrance animation */
    @keyframes rowSlide {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Rank change flash */
    @keyframes rankUp {
      0%   { background: rgba(0,255,175,0.2); }
      100% { background: transparent; }
    }
    .row-changed { animation: rankUp 1s ease; }

    /* ── DIVIDER lines between rows ── */
    .player-row + .player-row {
      border-top: 1px solid #0f0f0f;
    }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="starfield" id="starfield"></div>

<div class="display">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/AntonGenso/School21-RoadShow-Game/main/screen01/logo.png" alt="School 21">
    </div>

    <div class="game-title">
      <div class="game-title-main">Code<br><span>Invaders</span></div>
      <div class="game-title-sub">// live rankings</div>
    </div>

    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <div class="live-text">Live</div>
    </div>

    <div class="stat-block">
      <div class="stat-num" id="playerCount">—</div>
      <div class="stat-label">players competing</div>
    </div>

    <!-- TIMER BLOCK -->
    <div class="timer-block">
      <button class="btn-start" id="btnStart" onclick="startTimer()">▶ START ROUND</button>

      <div class="timer-display" id="timerDisplay">
        <div class="timer-digits" id="timerDigits">3:00</div>
        <div class="timer-label">// time remaining</div>
        <div class="timer-bar-wrap">
          <div class="timer-bar" id="timerBar"></div>
        </div>
      </div>

      <div class="frozen-badge" id="frozenBadge">// final results</div>
    </div>

    <div class="scan-hint">
      <div class="scan-hint-text">scan qr code to play</div>
      <div class="scan-hint-url">school21-roadshow</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <div class="board-header">
      <div class="board-title">// top players</div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="board-frozen-label" id="frozenLabel">🏆 final results</div>
        <div class="update-indicator" id="updateIndicator">// waiting for data...</div>
      </div>
    </div>

    <div class="board-list" id="boardList">
      <div class="board-empty">
        <div class="loading-spinner"></div>
        <div class="board-empty-text">loading...</div>
      </div>
    </div>

  </div>

</div>

<!-- Firebase -->
<canvas class="confetti-canvas" id="confettiCanvas"></canvas>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqHiiaHlGXbU0xFClfG7QWgy8u3sPWbUw",
    authDomain: "school21-roadshow.firebaseapp.com",
    databaseURL: "https://school21-roadshow-default-rtdb.firebaseio.com",
    projectId: "school21-roadshow",
    storageBucket: "school21-roadshow.firebasestorage.app",
    messagingSenderId: "869790309000",
    appId: "1:869790309000:web:d1b900402c211a93371d3d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const RANK_ICONS = ["🥇", "🥈", "🥉"];
  const MAX_ROWS = 10;
  const ROUND_DURATION = 3 * 60; // 3 минуты в секундах

  let lastRankings = [];
  let frozen = false;
  let pollInterval = null;
  let timerInterval = null;
  let secondsLeft = ROUND_DURATION;

  // ── РЕНДЕР ЛИДЕРБОРДА ──
  function renderBoard(players) {
    const list = document.getElementById("boardList");
    const countEl = document.getElementById("playerCount");
    const indicator = document.getElementById("updateIndicator");

    countEl.textContent = players.length;

    if (!frozen) {
      const now = new Date();
      const time = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}:${now.getSeconds().toString().padStart(2,"0")}`;
      indicator.textContent = `// updated ${time}`;
      indicator.classList.add("flash");
      setTimeout(() => indicator.classList.remove("flash"), 600);
    }

    if (players.length === 0) {
      list.innerHTML = `<div class="board-empty"><div class="board-empty-icon">🚀</div><div class="board-empty-text">// waiting for players...</div></div>`;
      lastRankings = [];
      return;
    }

    const top = players.slice(0, MAX_ROWS);
    list.innerHTML = "";
    top.forEach((p, i) => {
      const pos = i + 1;
      const rankClass = pos <= 3 ? `rank-${pos}` : "";
      const icon = pos <= 3 ? RANK_ICONS[i] : `<span class="row-rank-num">${pos}</span>`;
      const prevPos = lastRankings.indexOf(p.name);
      const changed = prevPos !== -1 && prevPos !== i;

      const row = document.createElement("div");
      const separator = pos === 4 ? " rank-separator" : "";
      row.className = `player-row ${rankClass}${separator} ${changed ? "row-changed" : ""}`;
      row.style.animation = `rowSlide 0.4s ease ${i * 0.05}s both`;
      row.innerHTML = `
        <div class="row-rank">${icon}</div>
        <div class="row-name">${p.name}</div>
        <div class="row-score">${p.score.toLocaleString()}<span class="row-score-pts">pts</span></div>
      `;
      list.appendChild(row);
    });

    lastRankings = top.map(p => p.name);
  }

  async function fetchLeaderboard() {
    if (frozen) return;
    try {
      const snapshot = await get(ref(db, "players"));
      const data = snapshot.val();
      if (!data) { renderBoard([]); return; }
      const players = Object.values(data)
        .filter(p => p.name && p.score > 0)
        .sort((a, b) => b.score - a.score);
      renderBoard(players);
    } catch (e) {
      console.error("Display fetch error:", e);
    }
  }

  // ── ФИНАЛ — заморозка ──
  async function freezeBoard() {
    frozen = true;
    clearInterval(pollInterval);
    clearInterval(timerInterval);

    // Последний запрос перед заморозкой
    try {
      const snapshot = await get(ref(db, "players"));
      const data = snapshot.val();
      if (data) {
        const players = Object.values(data)
          .filter(p => p.name && p.score > 0)
          .sort((a, b) => b.score - a.score);
        renderBoard(players);
      }
    } catch(e) {}

    // UI обновления
    document.getElementById("timerDigits").textContent = "0:00";
    document.getElementById("timerBar").style.width = "0%";
    document.getElementById("timerDisplay").classList.remove("active");
    document.getElementById("frozenBadge").classList.add("visible");
    document.getElementById("frozenLabel").classList.add("visible");
    document.getElementById("updateIndicator").textContent = "// frozen";
    document.getElementById("liveBadge").style.opacity = "0.3";

    // Конфетти!
    launchConfetti();
  }

  // ── ТАЙМЕР ──
  window.startTimer = function() {
    document.getElementById("btnStart").style.display = "none";
    document.getElementById("timerDisplay").classList.add("active");

    secondsLeft = ROUND_DURATION;
    updateTimerUI();

    // Начинаем поллинг если ещё не запущен
    fetchLeaderboard();
    pollInterval = setInterval(fetchLeaderboard, 10000);

    timerInterval = setInterval(() => {
      secondsLeft--;
      updateTimerUI();
      if (secondsLeft <= 0) freezeBoard();
    }, 1000);
  };

  function updateTimerUI() {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    const digits = document.getElementById("timerDigits");
    const bar = document.getElementById("timerBar");
    const pct = (secondsLeft / ROUND_DURATION) * 100;

    digits.textContent = `${m}:${s.toString().padStart(2,"0")}`;
    bar.style.width = pct + "%";

    const warn = secondsLeft <= 30;
    digits.classList.toggle("warning", warn);
    bar.classList.toggle("warning", warn);
  }

  // ── НАЧАЛЬНАЯ ЗАГРУЗКА (без таймера) ──
  fetchLeaderboard();

  // ── КОНФЕТТИ ──
  function launchConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ["#FFD700","#C0C0C0","#CD7F32","#00FFAF","#ffffff","#ff4444","#44aaff"];
    const pieces = Array.from({length: 200}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: 8 + Math.random() * 10,
      h: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.15,
      vy: 2 + Math.random() * 4,
      vx: (Math.random() - 0.5) * 2,
    }));

    let frame = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.vy; p.x += p.vx; p.rot += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, (canvas.height - p.y) / 200);
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      frame++;
      if (frame < 300) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
  }
</script>

<script>
  // Starfield — больше звёзд для большого экрана
  const starfield = document.getElementById("starfield");
  for (let i = 0; i < 200; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2.5 + 0.3;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*6}s;animation-delay:${Math.random()*6}s`;
    starfield.appendChild(s);
  }
</script>

</body>
