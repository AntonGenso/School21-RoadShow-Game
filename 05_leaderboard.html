<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leaderboard — Code Invaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint: #00FFAF;
      --mint-glow: rgba(0, 255, 175, 0.25);
      --bg: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1a1a1a;
      --text: #ffffff;
      --text-dim: #888888;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      overflow: hidden;
    }

    /* STARFIELD */
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* SCANLINES */
    .scanlines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
    }

    /* PAGE */
    .page {
      position: relative; z-index: 1;
      height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 0 16px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* FIXED HEADER */
    .header {
      width: 100%;
      padding: 20px 0 12px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      flex-shrink: 0;
    }

    .logo-wrap {
      width: 64px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      animation: logoGlow 3s ease-in-out infinite;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 8px var(--mint)); }
      50%       { filter: drop-shadow(0 0 20px var(--mint)); }
    }

    .header-title {
      font-size: 18px; font-weight: 900; letter-spacing: 0.15em;
      color: var(--text); text-transform: uppercase;
    }
    .header-title span { color: var(--mint); }

    /* YOUR RANK BADGE */
    .your-badge {
      width: 100%;
      background: rgba(0, 255, 175, 0.08);
      border: 1px solid rgba(0, 255, 175, 0.3);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    .your-badge-left {
      display: flex; align-items: center; gap: 8px;
    }

    .badge-pin {
      font-size: 10px; letter-spacing: 0.25em;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    .badge-name {
      font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
      color: var(--text);
    }

    .badge-rank {
      font-size: 18px; font-weight: 900;
      color: var(--mint); letter-spacing: 0.05em;
    }

    .badge-score {
      font-size: 11px; letter-spacing: 0.2em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
    }

    /* LIVE INDICATOR */
    .live-row {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; padding: 4px 0;
    }

    .live-dot {
      display: flex; align-items: center; gap: 6px;
      font-size: 9px; letter-spacing: 0.3em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }
    .live-dot::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .player-count {
      font-size: 9px; letter-spacing: 0.2em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
    }

    /* SCROLLABLE LIST */
    .list-wrap {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card-bg);
      -webkit-overflow-scrolling: touch;
    }

    .list-wrap::-webkit-scrollbar { width: 3px; }
    .list-wrap::-webkit-scrollbar-track { background: transparent; }
    .list-wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* LOADING */
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
      font-size: 10px; letter-spacing: 0.3em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      gap: 10px;
    }
    .loading-spinner {
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: var(--mint);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PLAYER ROW */
    .player-row {
      display: flex; align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #111;
      transition: background 0.2s;
      animation: rowIn 0.3s ease both;
    }
    .player-row:last-child { border-bottom: none; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* YOU row */
    .player-row.is-you {
      background: var(--mint);
      border-bottom-color: rgba(0,255,175,0.3);
    }
    .player-row.is-you .row-rank,
    .player-row.is-you .row-name,
    .player-row.is-you .row-score { color: #000; }
    .player-row.is-you .row-you-tag {
      font-size: 8px; letter-spacing: 0.2em;
      background: rgba(0,0,0,0.15);
      color: #000; border-radius: 4px;
      padding: 2px 6px; margin-left: 6px;
      font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    .row-rank {
      width: 36px; flex-shrink: 0;
      font-size: 13px; font-weight: 700;
      color: var(--text-dim); text-align: center;
    }
    .row-rank.top1 { color: #FFD700; font-size: 18px; }
    .row-rank.top2 { color: #C0C0C0; font-size: 18px; }
    .row-rank.top3 { color: #CD7F32; font-size: 18px; }

    .row-name {
      flex: 1;
      font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center;
    }

    .row-score {
      font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      flex-shrink: 0;
    }
    .player-row.is-you .row-score { color: #000; }

    /* BUTTONS */
    .btn-group {
      width: 100%; display: flex; gap: 10px;
      padding-top: 12px; flex-shrink: 0;
    }

    .btn {
      flex: 1; padding: 13px 10px;
      border-radius: 10px;
      font-family: "Orbitron", sans-serif;
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--mint); color: #000;
      border: 1px solid var(--mint);
      box-shadow: 0 0 16px var(--mint-glow);
    }
    .btn-primary:hover { box-shadow: 0 0 28px var(--mint); transform: translateY(-2px); }

    .btn-secondary {
      background: transparent; color: var(--mint);
      border: 1px solid var(--mint);
    }
    .btn-secondary:hover {
      background: rgba(0,255,175,0.08);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="starfield" id="starfield"></div>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/AntonGenso/School21-RoadShow-Game/main/screen01/logo.png" alt="School 21">
    </div>
    <div class="header-title">Leader<span>board</span></div>
  </div>

  <!-- YOUR BADGE (fixed) -->
  <div class="your-badge" id="yourBadge" style="display:none">
    <div class="your-badge-left">
      <div class="badge-pin">📍 you</div>
      <div class="badge-name" id="badgeName">—</div>
    </div>
    <div style="text-align:right">
      <div class="badge-rank" id="badgeRank">#—</div>
      <div class="badge-score" id="badgeScore">0 pts</div>
    </div>
  </div>

  <!-- LIVE ROW -->
  <div class="live-row">
    <div class="live-dot">live</div>
    <div class="player-count" id="playerCount">// loading...</div>
  </div>

  <!-- LIST -->
  <div class="list-wrap" id="listWrap">
    <div class="loading">
      <div class="loading-spinner"></div>
      loading...
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-group">
    <button class="btn btn-primary" onclick="playAgain()">↩ PLAY AGAIN</button>
    <button class="btn btn-secondary" onclick="goMenu()">⌂ MAIN MENU</button>
  </div>

</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqHiiaHlGXbU0xFClfG7QWgy8u3sPWbUw",
    authDomain: "school21-roadshow.firebaseapp.com",
    databaseURL: "https://school21-roadshow-default-rtdb.firebaseio.com",
    projectId: "school21-roadshow",
    storageBucket: "school21-roadshow.firebasestorage.app",
    messagingSenderId: "869790309000",
    appId: "1:869790309000:web:d1b900402c211a93371d3d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const playerName = sessionStorage.getItem("playerName") || "";
  let scrolledToPlayer = false;

  function getRankIcon(pos) {
    if (pos === 1) return { icon: "🥇", cls: "top1" };
    if (pos === 2) return { icon: "🥈", cls: "top2" };
    if (pos === 3) return { icon: "🥉", cls: "top3" };
    return { icon: pos, cls: "" };
  }

  function renderList(players) {
    const listWrap = document.getElementById("listWrap");
    listWrap.innerHTML = "";

    if (players.length === 0) {
      listWrap.innerHTML = `<div class="loading">// no players yet</div>`;
      return;
    }

    document.getElementById("playerCount").textContent = `// ${players.length} player${players.length !== 1 ? "s" : ""}`;

    let yourRank = null;
    let yourScore = 0;

    players.forEach((p, i) => {
      const pos = i + 1;
      const isYou = playerName && p.name.toLowerCase() === playerName.toLowerCase();
      if (isYou) {
        yourRank = pos;
        yourScore = p.score;
      }

      const { icon, cls } = getRankIcon(pos);
      const row = document.createElement("div");
      row.className = "player-row" + (isYou ? " is-you" : "");
      row.id = isYou ? "your-row" : "";
      row.style.animationDelay = `${i * 0.03}s`;

      row.innerHTML = `
        <div class="row-rank ${cls}">${icon}</div>
        <div class="row-name">
          ${p.name}
          ${isYou ? '<span class="row-you-tag">YOU</span>' : ""}
        </div>
        <div class="row-score">${p.score.toLocaleString()}</div>
      `;
      listWrap.appendChild(row);
    });

    // Update badge
    if (yourRank && playerName) {
      const badge = document.getElementById("yourBadge");
      badge.style.display = "flex";
      document.getElementById("badgeName").textContent = playerName;
      document.getElementById("badgeRank").textContent = `#${yourRank}`;
      document.getElementById("badgeScore").textContent = `${yourScore.toLocaleString()} pts`;
    }

    // Scroll to player row once
    if (!scrolledToPlayer) {
      scrolledToPlayer = true;
      setTimeout(() => {
        const yourRow = document.getElementById("your-row");
        if (yourRow) {
          yourRow.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }, 300);
    }
  }

  // Polling каждые 5 секунд вместо постоянного соединения
  const playersRef = ref(db, "players");

  async function fetchLeaderboard() {
    try {
      const snapshot = await get(playersRef);
      const data = snapshot.val();
      if (!data) {
        renderList([]);
        return;
      }
      const players = Object.values(data)
        .filter(p => p.name && p.score > 0)
        .sort((a, b) => b.score - a.score);
      renderList(players);
    } catch (e) {
      console.error("Leaderboard fetch error:", e);
      document.getElementById("listWrap").innerHTML =
        `<div class="loading">// connection error, retrying...</div>`;
    }
  }

  // Первый запрос сразу
  fetchLeaderboard();

  // Потом каждые 5 секунд
  setInterval(fetchLeaderboard, 10000);

  window.playAgain = function() {
    sessionStorage.removeItem("finalScore");
    window.location.href = "02_name.html";
  };

  window.goMenu = function() {
    window.location.href = "01_hub.html";
  };
</script>

<script>
  // Starfield
  const starfield = document.getElementById("starfield");
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    starfield.appendChild(s);
  }
</script>

</body>
</html>
