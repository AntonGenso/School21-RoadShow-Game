<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Code Invaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint: #00FFAF;
      --mint-dim: rgba(0, 255, 175, 0.15);
      --mint-glow: rgba(0, 255, 175, 0.3);
      --bg: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1e1e1e;
      --text: #ffffff;
      --text-dim: #666;
      --red: #FF4D4D;
      --red-glow: rgba(255, 77, 77, 0.3);
      --gold: #FFD700;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* STARFIELD */
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.8; }
    }

    /* SCANLINES */
    .scanlines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
      );
    }

    /* MAIN LAYOUT */
    .game {
      position: relative; z-index: 1;
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto;
    }

    /* ═══════════════════════════════
       TOP BAR
    ═══════════════════════════════ */
    .topbar {
      flex-shrink: 0;
      padding: 12px 16px 8px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #111;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    /* Lives */
    .lives {
      display: flex; gap: 4px; align-items: center;
    }

    .heart {
      font-size: 18px;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 4px rgba(255,80,80,0.6));
    }
    .heart.lost {
      opacity: 0.2;
      filter: none;
      transform: scale(0.8);
    }

    /* Timer */
    .timer-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }

    .timer {
      font-size: 22px; font-weight: 900; letter-spacing: 0.05em;
      color: var(--mint);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px var(--mint-glow);
    }
    .timer.warning { color: var(--red); text-shadow: 0 0 12px var(--red-glow); animation: timerPulse 0.5s ease infinite; }
    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer-label {
      font-size: 7px; letter-spacing: 0.4em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    /* Score */
    .score-wrap {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    }

    .score {
      font-size: 20px; font-weight: 900; letter-spacing: 0.05em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .score-label {
      font-size: 7px; letter-spacing: 0.4em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    /* Boost indicator */
    .boost-indicator {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 10px; letter-spacing: 0.2em;
      color: var(--gold); font-family: "Share Tech Mono", monospace;
      display: none;
      animation: boostPulse 1s ease infinite;
      z-index: 10;
    }
    .boost-indicator.active { display: block; }
    @keyframes boostPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 20px rgba(255,215,0,0.6); }
    }

    /* Streak indicator */
    .streak-indicator {
      position: absolute; top: 60px; right: 16px;
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--mint); font-family: "Share Tech Mono", monospace;
      display: none;
      z-index: 10;
    }
    .streak-indicator.active { display: block; }

    /* ═══════════════════════════════
       GAME ZONE (enemy falls here)
    ═══════════════════════════════ */
    .game-zone {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ═══════════════════════════════
       ENEMY CARD
    ═══════════════════════════════ */
    .enemy-card {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 340px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.05) inset;
    }

    .enemy-card-header {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }

    .enemy-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .enemy-dot.red { background: #FF5F57; }
    .enemy-dot.yellow { background: #FFBD2E; }
    .enemy-dot.green { background: #28CA41; }

    .enemy-filename {
      font-size: 9px; letter-spacing: 0.2em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      margin-left: 4px;
    }

    .enemy-code {
      font-family: "Share Tech Mono", monospace;
      font-size: 18px; line-height: 1.5;
      color: #ccc;
      white-space: nowrap;
    }

    .enemy-context {
      font-family: "Share Tech Mono", monospace;
      font-size: 14px; color: #c8a84b;
      margin-bottom: 8px;
    }

    /* Bug highlight styles */
    .bug { color: #FF6B6B; position: relative; }
    .bug-yellow { color: #FFD700; position: relative; }

    /* Cursor blink */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      vertical-align: text-bottom;
      animation: cursorBlink 1s step-end infinite;
      border-radius: 1px;
    }
    .cursor.yellow { background: #FFD700; }
    .cursor.white { background: rgba(255,255,255,0.6); }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ═══════════════════════════════
       SHIP ZONE
    ═══════════════════════════════ */
    .ship-zone {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Danger line */
    .danger-line {
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,77,77,0.3), transparent);
    }

    .ship-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: shipFloat 4s ease-in-out infinite;
    }

    @keyframes shipFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .ship-img {
      width: 90px; height: auto;
      filter: drop-shadow(0 0 12px rgba(0,255,175,0.4));
    }

    /* Engine flame */
    .engine-flame {
      position: absolute;
      bottom: -18px; left: 50%; transform: translateX(-50%);
      width: 18px;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
    }

    .flame-particle {
      border-radius: 50%;
      animation: flameDance linear infinite;
    }
    .flame-particle:nth-child(1) { width: 14px; height: 14px; background: radial-gradient(#fff, #00FFAF); animation-duration: 0.15s; }
    .flame-particle:nth-child(2) { width: 10px; height: 10px; background: radial-gradient(#00FFAF, #0088ff); animation-duration: 0.2s; opacity: 0.8; }
    .flame-particle:nth-child(3) { width: 6px; height: 6px; background: radial-gradient(#0088ff, transparent); animation-duration: 0.25s; opacity: 0.5; }

    @keyframes flameDance {
      0%, 100% { transform: scaleX(1) scaleY(1); }
      50% { transform: scaleX(0.8) scaleY(1.2); }
    }

    /* Shield */
    .shield {
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 1px solid rgba(0,255,175,0.2);
      animation: shieldPulse 3s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,175,0.1); border-color: rgba(0,255,175,0.15); }
      50% { box-shadow: 0 0 24px rgba(0,255,175,0.25); border-color: rgba(0,255,175,0.3); }
    }

    /* ═══════════════════════════════
       BOOSTER CARD
    ═══════════════════════════════ */
    .booster-card {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 48px); max-width: 340px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .booster-card.hidden { display: none; }
    .booster-card.type-heal { border-color: rgba(0,255,100,0.5); }
    .booster-card.type-boost { border-color: rgba(255,215,0,0.5); }
    .booster-card.type-virus { border-color: rgba(180,0,255,0.5); }

    .booster-emoji { font-size: 28px; line-height: 1; }
    .booster-name {
      font-family: "Share Tech Mono", monospace;
      font-size: 17px; letter-spacing: 0.05em; color: #ccc;
    }

    /* SLIDER */
    .booster-slider-wrap { width: 100%; padding: 4px 0; }

    .booster-slider-track {
      width: 100%; height: 20px;
      border-radius: 10px;
      background: linear-gradient(to right,
        #ff3333 0%,
        #ff6600 20%,
        #00ff88 35%,
        #00ff88 65%,
        #ff6600 80%,
        #ff3333 100%
      );
      position: relative;
      overflow: hidden;
      border: 1px solid #333;
    }

    .slider-cursor {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 6px; height: 28px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      left: 0%;
    }

    .booster-btn {
      width: 100%; padding: 13px;
      background: transparent;
      border: 1px solid var(--mint);
      border-radius: 10px;
      color: var(--mint);
      font-family: "Orbitron", sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .booster-btn:active { transform: scale(0.97); }
    .booster-btn.skip { border-color: var(--red); color: var(--red); }

    /* ═══════════════════════════════
       MISSILE
    ═══════════════════════════════ */
    .missile {
      position: absolute;
      font-size: 22px;
      z-index: 15;
      pointer-events: none;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 6px var(--mint));
    }
    .missile.hidden { display: none; }

    /* ═══════════════════════════════
       ANSWER BAR
    ═══════════════════════════════ */
    .answer-bar {
      flex-shrink: 0;
      padding: 10px 12px 16px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      border-top: 1px solid #111;
    }

    .answer-btn {
      background: #111;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 16px 8px;
      color: #ffffff;
      font-family: "Share Tech Mono", monospace;
      font-size: 17px; font-weight: 700; letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative; overflow: hidden;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .answer-btn:active { transform: scale(0.96); }

    .answer-btn:hover {
      border-color: var(--mint);
      background: rgba(0,255,175,0.05);
      box-shadow: 0 0 12px var(--mint-dim);
    }

    /* Correct flash */
    .answer-btn.correct {
      background: rgba(0,255,175,0.2);
      border-color: var(--mint);
      box-shadow: 0 0 20px var(--mint-glow);
      color: #fff;
    }

    /* Wrong flash */
    .answer-btn.wrong {
      background: rgba(255,77,77,0.2);
      border-color: var(--red);
      box-shadow: 0 0 20px var(--red-glow);
      color: var(--red);
    }

    /* ═══════════════════════════════
       BOOSTER BOTTOM BAR
    ═══════════════════════════════ */
    .booster-bar {
      flex-shrink: 0;
      padding: 12px 16px 16px;
      display: none;
      flex-direction: column; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid #222;
    }
    .booster-bar.active {
      display: flex;
    }
    .booster-bar.type-heal { border-top-color: rgba(0,255,100,0.4); }
    .booster-bar.type-boost { border-top-color: rgba(255,215,0,0.4); }
    .booster-bar.type-virus { border-top-color: rgba(180,0,255,0.4); }

    /* SLIDER inside bottom bar */
    .booster-slider-wrap { width: 100%; }

    .booster-slider-track {
      width: 100%; height: 22px;
      border-radius: 11px;
      background: linear-gradient(to right,
        #ff2222 0%,
        #ff5500 28%,
        #00ff88 35%,
        #00ff88 65%,
        #ff5500 72%,
        #ff2222 100%
      );
      position: relative;
      border: 1px solid #333;
      overflow: visible;
    }

    .slider-cursor {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 6px; height: 32px;
      background: #fff;
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(255,255,255,0.9);
      left: 0%;
      transition: left 0.016s linear;
    }

    .booster-btn {
      width: 100%; padding: 13px;
      background: transparent;
      border: 1px solid var(--mint);
      border-radius: 10px;
      color: var(--mint);
      font-family: "Orbitron", sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .booster-btn:active { transform: scale(0.97); }
    .booster-btn.skip { border-color: #cc44ff; color: #cc44ff; }

    /* ═══════════════════════════════
       FLOATING SCORE TEXT
    ═══════════════════════════════ */
    .float-text {
      position: absolute;
      font-family: "Orbitron", sans-serif;
      font-size: 18px; font-weight: 700;
      pointer-events: none;
      animation: floatUp 0.8s ease forwards;
      z-index: 20;
      text-shadow: 0 0 10px currentColor;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }

    /* ═══════════════════════════════
       SCREEN FLASH
    ═══════════════════════════════ */
    .screen-flash {
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0;
    }
    .screen-flash.red { background: rgba(255,77,77,0.25); animation: flashIn 0.4s ease; }
    .screen-flash.gold { background: rgba(255,215,0,0.2); animation: flashIn 0.4s ease; }
    .screen-flash.mint { background: rgba(0,255,175,0.15); animation: flashIn 0.4s ease; }

    @keyframes flashIn {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ═══════════════════════════════
       PAUSE / OVERLAY
    ═══════════════════════════════ */
    .overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }

    .overlay-title {
      font-size: 28px; font-weight: 900; letter-spacing: 0.15em;
      color: var(--mint); text-transform: uppercase;
      text-shadow: 0 0 24px var(--mint-glow);
    }

    .overlay-sub {
      font-size: 11px; letter-spacing: 0.3em;
      color: var(--text-dim); font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    .overlay-btn {
      padding: 14px 40px;
      background: var(--mint); color: #000;
      border: none; border-radius: 10px;
      font-family: "Orbitron", sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 0 24px var(--mint-glow);
      transition: all 0.2s;
    }
    .overlay-btn:hover { transform: translateY(-2px); box-shadow: 0 0 36px var(--mint); }

    /* countdown */
    .countdown {
      font-size: 80px; font-weight: 900;
      color: var(--mint);
      text-shadow: 0 0 40px var(--mint-glow);
      animation: countPop 0.4s ease;
    }
    @keyframes countPop {
      0% { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="starfield" id="starfield"></div>
<div class="screen-flash" id="screenFlash"></div>

<!-- BOOST INDICATOR -->
<div class="boost-indicator" id="boostIndicator">⚡ x2 — <span id="boostTimer">10</span>s</div>
<div class="streak-indicator" id="streakIndicator">🔥 <span id="streakCount">0</span></div>

<div class="game">

  <!-- TOP BAR -->
  <div class="topbar">

    <div class="lives" id="livesBar">
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
      <span class="heart" id="h3">❤️</span>
      <span class="heart" id="h4">❤️</span>
      <span class="heart" id="h5">❤️</span>
    </div>

    <div class="timer-wrap">
      <div class="timer" id="timer">3:00</div>
      <div class="timer-label">time</div>
    </div>

    <div class="score-wrap">
      <div class="score" id="score">0</div>
      <div class="score-label">score</div>
    </div>

  </div>

  <!-- GAME ZONE -->
  <div class="game-zone" id="gameZone">

    <!-- ENEMY CARD -->
    <div class="enemy-card" id="enemyCard" style="top: 0px;">
      <div class="enemy-card-header">
        <div class="enemy-dot red"></div>
        <div class="enemy-dot yellow"></div>
        <div class="enemy-dot green"></div>
        <span class="enemy-filename">bug_001.py</span>
      </div>
      <div class="enemy-code" id="enemyCode"></div>
    </div>

    <!-- BOOSTER CARD — falls like enemy -->
    <div class="booster-card hidden" id="boosterCard">
      <div class="enemy-card-header">
        <div class="enemy-dot red"></div>
        <div class="enemy-dot yellow"></div>
        <div class="enemy-dot green"></div>
        <span class="enemy-filename" id="boosterFilename">boost_001.exe</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:4px 0;">
        <span class="booster-emoji" id="boosterEmoji">💊</span>
        <span class="booster-name" id="boosterName">git --heal</span>
      </div>
    </div>

    <!-- MISSILE -->
    <div class="missile hidden" id="missile">🚀</div>

    <!-- SHIP ZONE -->
    <div class="ship-zone">
      <div class="ship-wrap" id="shipWrap">
        <div class="shield" id="shield"></div>
        <img class="ship-img" id="shipImg"
          src="screen01/spaceship1.png"
          alt="Ship">
        <div class="engine-flame">
          <div class="flame-particle"></div>
          <div class="flame-particle"></div>
          <div class="flame-particle"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ANSWER BAR -->
  <div class="answer-bar" id="answerBar">
    <button class="answer-btn" id="btn0" onclick="answerTap(0)">)</button>
    <button class="answer-btn" id="btn1" onclick="answerTap(1)">]</button>
    <button class="answer-btn" id="btn2" onclick="answerTap(2)">}</button>
    <button class="answer-btn" id="btn3" onclick="answerTap(3)">;</button>
  </div>

  <!-- BOOSTER BOTTOM BAR -->
  <div class="booster-bar" id="boosterBar">
    <div class="booster-slider-wrap">
      <div class="booster-slider-track">
        <div class="slider-cursor" id="sliderCursor"></div>
      </div>
    </div>
    <button class="booster-btn" id="boosterBtn" onclick="boosterTap()">TAKE IT</button>
  </div>

</div>

<!-- START OVERLAY -->
<div class="overlay" id="startOverlay">
  <div class="overlay-title">Ready?</div>
  <div class="overlay-sub">// fix the bugs before they reach your ship</div>
  <button class="overlay-btn" onclick="startCountdown()">START</button>
</div>

<!-- COUNTDOWN OVERLAY -->
<div class="overlay hidden" id="countdownOverlay">
  <div class="countdown" id="countdownNum">3</div>
</div>

<script>
  // ═══════════════════════════════════════════
  // STARFIELD
  // ═══════════════════════════════════════════
  const starfield = document.getElementById("starfield");
  for (let i = 0; i < 100; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 0.5;

  // ═══════════════════════════════════════════
  // GAME STATE
  // ═══════════════════════════════════════════
  const STATE = {
    lives: 5,
    score: 0,
    streak: 0,
    timeLeft: 180, // 3 minutes in seconds
    running: false,
    locked: false, // prevent double tap
    boostActive: false,
    boostTimeLeft: 0,
    currentQuestion: null,
    questionIndex: { easy: 0, medium: 0, hard: 0 },

    enemyDriftOffset: 0,

  };

  // Shuffle helper
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ═══════════════════════════════════════════
  // COUNTDOWN → START
  // ═══════════════════════════════════════════
  function startCountdown() {
    document.getElementById("startOverlay").classList.add("hidden");
    document.getElementById("countdownOverlay").classList.remove("hidden");
    let count = 3;
    const el = document.getElementById("countdownNum");

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        el.textContent = count;
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "countPop 0.4s ease";
      } else {
        clearInterval(interval);
        document.getElementById("countdownOverlay").classList.add("hidden");
        startGame();
      }
    }, 800);
  }

  // ═══════════════════════════════════════════
  // GAME START
  // ═══════════════════════════════════════════
  function startGame() {
    // Вопросы идут строго по порядку 1→30
    STATE.questionIndex = 0;
    STATE.running = true;
    STATE.pendingBooster = null;

    startTimer();
    initBoosters();
    nextQuestion();
  }

  // ═══════════════════════════════════════════
  // TIMER
  // ═══════════════════════════════════════════
  function startTimer() {
    const timerEl = document.getElementById("timer");
    const tick = setInterval(() => {
      if (!STATE.running) { clearInterval(tick); return; }
      STATE.timeLeft--;
      const m = Math.floor(STATE.timeLeft / 60);
      const s = STATE.timeLeft % 60;
      timerEl.textContent = `${m}:${s.toString().padStart(2,"0")}`;

      if (STATE.timeLeft <= 30) timerEl.classList.add("warning");
      if (STATE.timeLeft <= 0) {
        clearInterval(tick);
        endGame();
      }
    }, 1000);
  }

  // ═══════════════════════════════════════════
  // GET NEXT QUESTION — строго по порядку 1→30
  // ═══════════════════════════════════════════
  function getNextQuestion() {
    if (STATE.questionIndex >= QUESTIONS.length) {
      STATE.questionIndex = 0; // прошли все 30 — начинаем сначала
    }
    return QUESTIONS[STATE.questionIndex++];
  }

  // ═══════════════════════════════════════════
  // NEXT QUESTION — render + start fall
  // ═══════════════════════════════════════════
  function nextQuestion() {
    if (!STATE.running) return;
    STATE.locked = false;

    // Скрываем карточку врага в любом случае
    const enemyCard = document.getElementById("enemyCard");
    enemyCard.style.opacity = "0";
    enemyCard.style.top = "0px";
    enemyCard.style.transform = "translateX(-50%)";

    // Check if booster is pending
    if (STATE.pendingBooster) {
      const type = STATE.pendingBooster;
      showBooster(type);
      return;
    }

    const q = getNextQuestion();
    STATE.currentQuestion = q;
    const shuffledOptions = shuffle([...q.options]);
    STATE.currentQuestion.shuffledOptions = shuffledOptions;
    renderEnemy(q, shuffledOptions);
    startEnemyFall();
  }

  function renderEnemy(q, options) {
    const card = document.getElementById("enemyCard");
    const codeEl = document.getElementById("enemyCode");

    // Reset position
    card.style.top = "0px";
    card.style.left = "50%";
    card.style.transform = "translateX(-50%)";
    card.style.opacity = "1";
    card.className = "enemy-card";
    STATE.enemyY = 0;
    STATE.enemyDriftOffset = 0;

    // Context line for medium/hard
    let html = "";
    if (q.context) {
      html += `<div class="enemy-context">${q.context}</div>`;
    }
    html += q.code;

    // Cursor
    if (q.cursor === "yellow") html += `<span class="cursor yellow"></span>`;
    else if (q.cursor === "white") html += `<span class="cursor white"></span>`;

    codeEl.innerHTML = html;

    // Render answer buttons
    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      btn.textContent = options[i];
      btn.className = "answer-btn";
      btn.disabled = false;
    }
  }

  // ═══════════════════════════════════════════
  // ENEMY FALL ANIMATION
  // ═══════════════════════════════════════════
  function startEnemyFall() {
    if (STATE.enemyFallInterval) clearInterval(STATE.enemyFallInterval);

    const card = document.getElementById("enemyCard");
    const gameZone = document.getElementById("gameZone");
    const totalHeight = gameZone.offsetHeight - 110;

    // Easy = 7 seconds, Medium/Hard = 5 seconds
    const tier = STATE.currentQuestion ? STATE.currentQuestion.tier : "easy";
    const fallDuration = tier === "easy" ? 7000 : 5000;

    const fps = 30;
    const step = totalHeight / (fallDuration / (1000 / fps));

    STATE.enemyFallInterval = setInterval(() => {
      if (!STATE.running || STATE.locked) return;

      STATE.enemyY += step;

      // Drift left-right
      STATE.enemyDriftOffset += 0.4 * STATE.enemyDriftDir;
      if (Math.abs(STATE.enemyDriftOffset) > 8) STATE.enemyDriftDir *= -1;

      card.style.top = `${STATE.enemyY}px`;
      card.style.transform = `translateX(calc(-50% + ${STATE.enemyDriftOffset}px))`;

      // Enemy reached ship
      if (STATE.enemyY >= totalHeight) {
        clearInterval(STATE.enemyFallInterval);
        if (!STATE.locked) enemyReachedShip();
      }
    }, 1000 / fps);
  }

  // ═══════════════════════════════════════════
  // ANSWER TAP
  // ═══════════════════════════════════════════
  function answerTap(index) {
    if (STATE.locked || !STATE.running) return;
    STATE.locked = true;

    if (STATE.enemyFallInterval) clearInterval(STATE.enemyFallInterval);

    const selected = STATE.currentQuestion.shuffledOptions[index];
    const correct = STATE.currentQuestion.correct;
    const btn = document.getElementById(`btn${index}`);

    if (selected === correct) {
      onCorrectAnswer(btn);
    } else {
      onWrongAnswer(btn);
    }
  }

  // ═══════════════════════════════════════════
  // WRONG ANSWER
  // ═══════════════════════════════════════════
  function onWrongAnswer(btn) {
    btn.classList.add("wrong");
    STATE.streak = 0;
    updateStreak();

    loseLife();
    shakeEnemy();
    flashScreen("red");

    setTimeout(() => {
      btn.classList.remove("wrong");
      if (STATE.lives > 0) {
        flyEnemyAway("side");
        setTimeout(() => nextQuestion(), 300);
      }
    }, 500);
  }

  // ═══════════════════════════════════════════
  // ENEMY REACHED SHIP
  // ═══════════════════════════════════════════
  function enemyReachedShip() {
    STATE.locked = true;
    STATE.streak = 0;
    updateStreak();

    // Enemy crash into ship effect
    crashEnemyIntoShip();

    loseLife();
    flashScreen("red");
    shieldHit();
    shipCrashShake();

    setTimeout(() => {
      if (STATE.lives > 0) nextQuestion();
    }, 700);
  }

  function crashEnemyIntoShip() {
    // Enemy card slams down to ship position then disappears
    const card = document.getElementById("enemyCard");
    const zone = document.getElementById("gameZone");
    card.style.transition = "transform 0.15s ease-in, opacity 0.15s ease";
    card.style.transform = `translateX(calc(-50% + ${STATE.enemyDriftOffset}px)) scale(0.6)`;
    card.style.opacity = "0";

    // Spawn red impact particles at ship
    const shipWrap = document.getElementById("shipWrap");
    const rect = shipWrap.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2,
      ["#ff4444", "#ff8800", "#ffffff", "#ffcc00"], 16);
  }

  function shipCrashShake() {
    const ship = document.getElementById("shipWrap");
    ship.style.animation = "none";
    ship.style.animation = "shipShake 0.4s ease";
    setTimeout(() => { ship.style.animation = ""; }, 400);
  }

  // ═══════════════════════════════════════════
  // LIVES
  // ═══════════════════════════════════════════
  function loseLife() {
    if (STATE.lives <= 0) return;
    STATE.lives--;
    updateLives();
    spawnFloatText("-1 ❤️", "var(--red)", document.getElementById("livesBar"));
    if (STATE.lives <= 0) {
      setTimeout(() => endGame(), 600);
    }
  }

  function gainLife() {
    if (STATE.lives >= 5) return;
    STATE.lives++;
    updateLives();
    spawnFloatText("+1 ❤️", "var(--mint)", document.getElementById("livesBar"));
  }

  function updateLives() {
    for (let i = 1; i <= 5; i++) {
      const h = document.getElementById(`h${i}`);
      if (i <= STATE.lives) h.classList.remove("lost");
      else h.classList.add("lost");
    }
  }

  // ═══════════════════════════════════════════
  // SCORE & STREAK
  // ═══════════════════════════════════════════
  function updateScore() {
    document.getElementById("score").textContent = STATE.score.toLocaleString();
  }

  function updateStreak() {
    const el = document.getElementById("streakIndicator");
    const cnt = document.getElementById("streakCount");
    if (STATE.streak >= 3) {
      el.classList.add("active");
      cnt.textContent = STATE.streak;
    } else {
      el.classList.remove("active");
    }
    // Auto gain life at streak 5
    if (STATE.streak === 5) {
      gainLife();
    }
  }

  // ═══════════════════════════════════════════
  // ANIMATIONS
  // ═══════════════════════════════════════════
  function flyEnemyAway(direction) {
    const card = document.getElementById("enemyCard");
    card.style.transition = "transform 0.4s ease, opacity 0.4s ease";
    if (direction === "up" || direction === "explode") {
      card.style.transform = `translateX(calc(-50% + ${STATE.enemyDriftOffset}px)) translateY(-80px) scale(${direction === "explode" ? "1.2" : "1"})`;
    } else {
      const side = Math.random() > 0.5 ? "150px" : "-150px";
      card.style.transform = `translateX(calc(-50% + ${side})) rotate(15deg)`;
    }
    card.style.opacity = "0";
    setTimeout(() => { card.style.transition = ""; }, 400);
  }

  function shakeEnemy() {
    const card = document.getElementById("enemyCard");
    card.style.animation = "shakeCard 0.3s ease";
    setTimeout(() => card.style.animation = "", 300);
  }

  // ═══════════════════════════════════════════
  // PARTICLE EXPLOSION
  // ═══════════════════════════════════════════
  function spawnParticles(x, y, colors, count = 18) {
    const zone = document.getElementById("gameZone");
    const zoneRect = zone.getBoundingClientRect();
    const cx = x - zoneRect.left;
    const cy = y - zoneRect.top;

    for (let i = 0; i < count; i++) {
      const p = document.createElement("div");
      const size = Math.random() * 8 + 4;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
      const speed = 60 + Math.random() * 80;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;

      p.style.cssText = `
        position:absolute;
        width:${size}px; height:${size}px;
        border-radius:${Math.random() > 0.5 ? "50%" : "2px"};
        background:${color};
        left:${cx}px; top:${cy}px;
        pointer-events:none;
        z-index:20;
        box-shadow: 0 0 4px ${color};
      `;
      zone.appendChild(p);

      const duration = 400 + Math.random() * 300;
      const start = performance.now();

      (function animateParticle(startX, startY, velX, velY) {
        function step(now) {
          const t = (now - start) / duration;
          if (t >= 1) { p.remove(); return; }
          p.style.left = `${startX + velX * t}px`;
          p.style.top  = `${startY + velY * t + 40 * t * t}px`; // slight gravity
          p.style.opacity = 1 - t;
          p.style.transform = `rotate(${t * 360}deg)`;
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })(cx, cy, vx, vy);
    }
  }

  function explodeEnemy() {
    const card = document.getElementById("enemyCard");
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    spawnParticles(cx, cy, ["#00FFAF", "#ffffff", "#FFD700", "#ff6b6b"], 22);
  }

  function explodeVirus() {
    const card = document.getElementById("boosterCard");
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    spawnParticles(cx, cy, ["#cc44ff", "#ff44ff", "#8800ff", "#ffffff"], 20);
  }

  function shieldHit() {
    const shield = document.getElementById("shield");
    shield.style.borderColor = "rgba(255,77,77,0.8)";
    shield.style.boxShadow = "0 0 24px rgba(255,77,77,0.5)";

  function flashScreen(type) {
    const el = document.getElementById("screenFlash");
    el.className = `screen-flash ${type}`;
    setTimeout(() => el.className = "screen-flash", 400);
  }

  function spawnFloatText(text, color, anchor) {
    const el = document.createElement("div");
    el.className = "float-text";
    el.textContent = text;
    el.style.color = color;

    const zone = document.getElementById("gameZone");
    const rect = anchor ? anchor.getBoundingClientRect() : zone.getBoundingClientRect();
    const zoneRect = zone.getBoundingClientRect();

    el.style.left = `${rect.left - zoneRect.left + rect.width / 2 - 30}px`;
    el.style.top = `${rect.top - zoneRect.top}px`;
    zone.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // ═══════════════════════════════════════════
  // BOOSTERS CONFIG
  // ═══════════════════════════════════════════
  const BOOSTERS = [
    { type:"heal",  emoji:"💊", name:"git --heal",  btn:"TAKE IT", btnClass:"" },
    { type:"boost", emoji:"⚡", name:"boost.exe",   btn:"TAKE IT", btnClass:"" },
    { type:"virus", emoji:"☠️", name:"virus.exe",   btn:"SKIP IT", btnClass:"skip" },
  ];

  // Booster scheduling
  let boosterTimers = [];

  function scheduleBooster(type, delay) {
    const t = setTimeout(() => {
      if (!STATE.running) return;
      STATE.pendingBooster = type;
    }, delay);
    boosterTimers.push(t);
  }

  function initBoosters() {
    scheduleBooster("heal",  40000);
    scheduleBooster("boost", 55000);
    scheduleBooster("virus", 28000);
    scheduleBooster("heal",  95000);
    scheduleBooster("virus", 75000);
    scheduleBooster("boost", 115000);
  }

  // ═══════════════════════════════════════════
  // SHOW BOOSTER
  // ═══════════════════════════════════════════
  let sliderInterval = null;
  let sliderPos = 0;
  let sliderDir = 1;
  let currentBoosterType = null;

  function showBooster(type) {
    const cfg = BOOSTERS.find(b => b.type === type);
    currentBoosterType = type;

    // Show booster card falling like enemy
    const card = document.getElementById("boosterCard");
    card.className = "booster-card";
    card.style.top = "0px";
    card.style.left = "50%";
    card.style.transform = "translateX(-50%)";
    card.style.opacity = "1";
    STATE.enemyY = 0;
    STATE.enemyDriftOffset = 0;

    document.getElementById("boosterEmoji").textContent = cfg.emoji;
    document.getElementById("boosterName").textContent = cfg.name;
    document.getElementById("boosterFilename").textContent = `${cfg.name}.exe`;

    // Show booster bottom bar, hide answer bar
    document.getElementById("answerBar").style.display = "none";
    const bar = document.getElementById("boosterBar");
    bar.className = `booster-bar active type-${type}`;
    const btn = document.getElementById("boosterBtn");
    btn.textContent = cfg.btn;
    btn.className = `booster-btn ${cfg.btnClass}`;

    // Start booster card falling (same speed as enemy)
    startBoosterFall();

    // Start slider
    sliderPos = 0;
    sliderDir = 1;
    if (sliderInterval) clearInterval(sliderInterval);
    sliderInterval = setInterval(() => {
      sliderPos += 1.2 * sliderDir;
      if (sliderPos >= 100) { sliderPos = 100; sliderDir = -1; }
      if (sliderPos <= 0)   { sliderPos = 0;   sliderDir = 1; }
      document.getElementById("sliderCursor").style.left = `calc(${sliderPos}% - 3px)`;
    }, 16);
  }

  function startBoosterFall() {
    if (STATE.enemyFallInterval) clearInterval(STATE.enemyFallInterval);
    const card = document.getElementById("boosterCard");
    const gameZone = document.getElementById("gameZone");
    const totalHeight = gameZone.offsetHeight - 110;
    const fps = 30;
    const step = totalHeight / (6000 / (1000 / fps));

    STATE.enemyFallInterval = setInterval(() => {
      if (!STATE.running) return;
      STATE.enemyY += step;
      STATE.enemyDriftOffset += 0.4 * STATE.enemyDriftDir;
      if (Math.abs(STATE.enemyDriftOffset) > 8) STATE.enemyDriftDir *= -1;

      card.style.top = `${STATE.enemyY}px`;
      card.style.transform = `translateX(calc(-50% + ${STATE.enemyDriftOffset}px))`;

      if (STATE.enemyY >= totalHeight) {
        clearInterval(STATE.enemyFallInterval);
        STATE.pendingBooster = null;
        // Вирус долетел — игрок не нажал SKIP IT → -1 жизнь
        if (currentBoosterType === "virus") {
          loseLife();
          flashScreen("red");
          shieldHit();
          shipCrashShake();
        }
        hideBooster();
        nextQuestion();
      }
    }, 1000 / fps);
  }

  function hideBooster() {
    if (sliderInterval) { clearInterval(sliderInterval); sliderInterval = null; }
    if (STATE.enemyFallInterval) { clearInterval(STATE.enemyFallInterval); STATE.enemyFallInterval = null; }
    document.getElementById("boosterCard").className = "booster-card hidden";
    document.getElementById("boosterBar").className = "booster-bar";
    document.getElementById("answerBar").style.display = "";
    currentBoosterType = null;
  }

  function boosterTap() {
    if (!currentBoosterType) return;
    clearInterval(sliderInterval);

    const inGreen = sliderPos >= 35 && sliderPos <= 65;

    if (currentBoosterType === "heal") {
      if (inGreen) {
        fireBoosterMissile(() => {
          gainLife();
          flashScreen("mint");
          spawnFloatText("+1 ❤️", "#00ff88", document.getElementById("boosterCard"));
        });
      } else spawnFloatText("MISSED", "#666", document.getElementById("boosterCard"));
    } else if (currentBoosterType === "boost") {
      if (inGreen) {
        fireBoosterMissile(() => {
          activateBoost();
          flashScreen("gold");
          spawnFloatText("⚡ x2!", "var(--gold)", document.getElementById("boosterCard"));
        });
      } else spawnFloatText("MISSED", "#666", document.getElementById("boosterCard"));
    } else if (currentBoosterType === "virus") {
      if (inGreen) {
        fireBoosterMissile(() => {
          explodeVirus();
          flashScreen("mint");
          spawnFloatText("✅ DODGED", "var(--mint)", document.getElementById("boosterCard"));
        });
      } else { loseLife(); flashScreen("red"); shieldHit(); }
    }

    STATE.pendingBooster = null;
    setTimeout(() => {
      hideBooster();
      nextQuestion();
    }, 700);
  }

  function fireBoosterMissile(onHit) {
    // Same as fireMissile but targets boosterCard
    const missile = document.getElementById("missile");
    const shipWrap = document.getElementById("shipWrap");
    const boosterCard = document.getElementById("boosterCard");
    const zone = document.getElementById("gameZone");

    const zoneRect = zone.getBoundingClientRect();
    const shipRect = shipWrap.getBoundingClientRect();
    const targetRect = boosterCard.getBoundingClientRect();

    const startX = shipRect.left - zoneRect.left + shipRect.width / 2 - 11;
    const startY = shipRect.top  - zoneRect.top  - 20;
    const endX   = targetRect.left - zoneRect.left + targetRect.width / 2 - 11;
    const endY   = targetRect.top  - zoneRect.top  + targetRect.height / 2;

    missile.style.left = `${startX}px`;
    missile.style.top  = `${startY}px`;
    missile.classList.remove("hidden");

    const duration = 350;
    const start = performance.now();

    function animate(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      missile.style.left = `${startX + (endX - startX) * ease}px`;
      missile.style.top  = `${startY + (endY - startY) * ease}px`;
      if (t < 1) requestAnimationFrame(animate);
      else {
        missile.classList.add("hidden");
        // Взрыв при попадании в бустер
        const card = document.getElementById("boosterCard");
        const rect = card.getBoundingClientRect();
        spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2,
          ["#00FFAF", "#ffffff", "#FFD700", "#ff6b6b"], 22);
        if (onHit) onHit();
      }
    }
    requestAnimationFrame(animate);
  }

  // ═══════════════════════════════════════════
  // BOOST ACTIVE
  // ═══════════════════════════════════════════
  let boostCountdown = null;

  function activateBoost() {
    STATE.boostActive = true;
    STATE.boostTimeLeft = 10;
    document.getElementById("boostIndicator").classList.add("active");
    document.getElementById("boostTimer").textContent = 10;

    if (boostCountdown) clearInterval(boostCountdown);
    boostCountdown = setInterval(() => {
      STATE.boostTimeLeft--;
      document.getElementById("boostTimer").textContent = STATE.boostTimeLeft;
      if (STATE.boostTimeLeft <= 0) {
        clearInterval(boostCountdown);
        STATE.boostActive = false;
        document.getElementById("boostIndicator").classList.remove("active");
      }
    }, 1000);
  }

  // ═══════════════════════════════════════════
  // MISSILE ANIMATION
  // ═══════════════════════════════════════════
  function fireMissile(onComplete) {
    const missile = document.getElementById("missile");
    const shipWrap = document.getElementById("shipWrap");
    const enemyCard = document.getElementById("enemyCard");
    const zone = document.getElementById("gameZone");

    const zoneRect = zone.getBoundingClientRect();
    const shipRect = shipWrap.getBoundingClientRect();
    const enemyRect = enemyCard.getBoundingClientRect();

    const startX = shipRect.left - zoneRect.left + shipRect.width / 2 - 11;
    const startY = shipRect.top - zoneRect.top - 20;
    const endX = enemyRect.left - zoneRect.left + enemyRect.width / 2 - 11;
    const endY = enemyRect.top - zoneRect.top + enemyRect.height / 2;

    missile.style.left = `${startX}px`;
    missile.style.top = `${startY}px`;
    missile.classList.remove("hidden");

    const duration = 400;
    const start = performance.now();

    function animate(now) {
      const t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const x = startX + (endX - startX) * ease;
      const y = startY + (endY - startY) * ease;
      missile.style.left = `${x}px`;
      missile.style.top = `${y}px`;

      if (t < 1) requestAnimationFrame(animate);
      else {
        missile.classList.add("hidden");
        if (onComplete) onComplete();
      }
    }
    requestAnimationFrame(animate);
  }

  // Override correct answer to include missile
  function onCorrectAnswer(btn) {
    btn.classList.add("correct");

    let points = 100;
    STATE.streak++;
    if (STATE.streak >= 5) points *= 2;
    if (STATE.boostActive) points *= 2;
    STATE.score += points;

    updateScore();
    updateStreak();
    spawnFloatText(`+${points}`, "var(--mint)", btn);

    // Fire missile first, then explode enemy
    fireMissile(() => {
      explodeEnemy();
      flyEnemyAway("explode");
      setTimeout(() => {
        btn.classList.remove("correct");
        nextQuestion();
      }, 300);
    });
  }
  function endGame() {
    STATE.running = false;
    if (STATE.enemyFallInterval) clearInterval(STATE.enemyFallInterval);
    if (sliderInterval) clearInterval(sliderInterval);
    if (boostCountdown) clearInterval(boostCountdown);
    boosterTimers.forEach(t => clearTimeout(t));

    sessionStorage.setItem("finalScore", STATE.score);
    setTimeout(() => {
      window.location.href = "04_gameover.html";
    }, 800);
  }
</script>

<style>
  @keyframes shakeCard {
    0%, 100% { transform: translateX(-50%); }
    20% { transform: translateX(calc(-50% - 8px)); }
    40% { transform: translateX(calc(-50% + 8px)); }
    60% { transform: translateX(calc(-50% - 5px)); }
    80% { transform: translateX(calc(-50% + 5px)); }
  }

  @keyframes shipShake {
    0%, 100% { transform: translateY(0) translateX(0); }
    15% { transform: translateY(-4px) translateX(-6px); }
    30% { transform: translateY(4px) translateX(6px); }
    45% { transform: translateY(-3px) translateX(-4px); }
    60% { transform: translateY(3px) translateX(4px); }
    75% { transform: translateY(-2px) translateX(-2px); }
  }
</style>

</body>
