<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Hero: Code → Run → Survive</title>
    <style>
        :root {
            --bg: #0a0e27;
            --bg-light: #1a1f3a;
            --primary: #00ff88;
            --accent: #00d4ff;
            --error: #ff4757;
            --text: #e5e7eb;
            --text-muted: #94a3b8;
            --code-bg: #0d1117;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 136, 0.2);
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .lang-button {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .lang-button:hover {
            background: var(--primary);
            color: var(--bg);
            transform: translateY(-2px);
        }

        /* Menu */
        .menu-screen {
            max-width: 800px;
            margin: 0 auto;
        }

        .menu-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .menu-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .level-card {
            background: var(--bg-light);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .level-card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .level-icon {
            font-size: 3rem;
        }

        .level-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .level-description {
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Game Screen */
        .game-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .code-panel {
            background: var(--code-bg);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 30px;
        }

        .code-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .code-block {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text);
            white-space: pre;
        }

        .code-keyword {
            color: #ff6b9d;
        }

        .code-type {
            color: #00d4ff;
        }

        .code-function {
            color: #ffd93d;
        }

        .code-comment {
            color: #6b7280;
            font-style: italic;
        }

        .code-number {
            color: #a78bfa;
        }

        .scene-panel {
            background: var(--bg-light);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 400px;
        }

        .scene {
            font-size: 8rem;
            margin: 20px 0;
            transition: all 0.3s ease;
        }

        .health-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 71, 87, 0.2);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--error);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--error), #ff6348);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .door {
            font-size: 10rem;
            transition: all 0.5s ease;
        }

        .door.open {
            opacity: 0.3;
            transform: translateX(100px);
        }

        /* Options */
        .options-panel {
            background: var(--bg-light);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 30px;
        }

        .options-title {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .option-btn {
            width: 100%;
            background: var(--code-bg);
            border: 2px solid rgba(0, 212, 255, 0.3);
            color: var(--text);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(5px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.1);
        }

        .option-btn.correct {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.2);
            animation: correctPulse 0.5s ease;
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: rgba(255, 71, 87, 0.2);
            animation: shake 0.5s ease;
        }

        /* Run Button */
        .run-button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: var(--bg);
            padding: 20px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .run-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.5);
        }

        .run-button:active {
            transform: scale(0.98);
        }

        .run-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 60px 40px;
            background: var(--bg-light);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 136, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }

        .result-icon {
            font-size: 8rem;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .result-title.success {
            color: var(--primary);
        }

        .result-title.error {
            color: var(--error);
        }

        .result-message {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .insight-box {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
        }

        .insight-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .insight-text {
            color: var(--text);
            line-height: 1.6;
        }

        /* Buttons */
        .btn {
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--bg);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes errorFlash {
            0%, 100% { background: var(--bg-light); }
            50% { background: rgba(255, 71, 87, 0.3); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .error-flash {
            animation: errorFlash 0.3s ease;
        }

        /* Mobile */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .game-container {
                padding: 10px;
            }

            .game-header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
                text-align: center;
            }

            .game-title {
                font-size: 1.8rem;
            }

            .game-subtitle {
                font-size: 0.9rem;
            }

            .game-screen {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .code-panel,
            .scene-panel,
            .options-panel {
                padding: 20px;
            }

            .scene {
                font-size: 5rem;
            }

            .door {
                font-size: 6rem;
            }

            .code-block {
                font-size: 0.85rem;
                line-height: 1.6;
            }

            .option-btn {
                font-size: 0.95rem;
                padding: 15px;
            }

            .run-button {
                font-size: 1.2rem;
                padding: 15px;
            }

            .level-card {
                padding: 20px;
            }

            .level-icon {
                font-size: 2.5rem;
            }

            .level-title {
                font-size: 1.3rem;
            }

            .result-screen {
                padding: 40px 20px;
            }

            .result-icon {
                font-size: 5rem;
            }

            .result-title {
                font-size: 1.8rem;
            }

            .insight-box {
                padding: 15px;
            }

            .mission-card {
                padding: 15px !important;
            }

            .mission-card h3 {
                font-size: 1.2rem !important;
            }

            .mission-card p {
                font-size: 0.9rem !important;
            }

            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .language-icon {
                font-size: 4rem;
            }

            .language-title {
                font-size: 2rem;
            }

            .language-btn {
                font-size: 1.1rem;
                padding: 20px;
            }
        }

        /* Language Selection */
        .language-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .language-card {
            max-width: 500px;
            text-align: center;
        }

        .language-icon {
            font-size: 5rem;
            margin-bottom: 30px;
        }

        .language-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .language-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .language-buttons {
            display: grid;
            gap: 20px;
        }

        .language-btn {
            background: var(--bg-light);
            border: 2px solid rgba(0, 255, 136, 0.3);
            color: var(--text);
            padding: 25px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .language-btn:hover {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.1);
            transform: scale(1.05);
        }
    </style>
</head>

        // Option Selection
        function selectOption(option) {
            selectedOption = option;
            
            // Remove all selected classes
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Add selected class to clicked option
            const optionBtn = document.getElementById('option-' + option);
            if (optionBtn) {
                optionBtn.classList.add('selected');
            }
            
            // Enable run button
            document.getElementById('runButton').disabled = false;
        }

        // Run Code
        function runCode() {
            const level = levels[currentLevel];
            const isCorrect = selectedOption === level.correctAnswer;
            
            // Track attempt
            if (!levelStats[level.id]) {
                levelStats[level.id] = { attempts: 0, bestXP: 0, completed: false };
            }
            levelStats[level.id].attempts++;
            
            // Disable run button
            document.getElementById('runButton').disabled = true;
            
            // Disable all options
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.style.pointerEvents = 'none';
            });
            
            if (isCorrect) {
                // Calculate XP based on attempts
                const attempts = levelStats[level.id].attempts;
                let xpEarned = 0;
                if (attempts === 1) {
                    xpEarned = 50; // First try
                } else if (attempts === 2) {
                    xpEarned = 30; // Second try
                } else {
                    xpEarned = 20; // Third+ try
                }
                
                // Update stats only if new XP is better
                if (xpEarned > levelStats[level.id].bestXP) {
                    const xpDiff = xpEarned - levelStats[level.id].bestXP;
                    totalXP += xpDiff;
                    levelStats[level.id].bestXP = xpEarned;
                }
                
                levelStats[level.id].completed = true;
                
                // Save to localStorage
                localStorage.setItem('chero_totalXP', totalXP.toString());
                localStorage.setItem('chero_stats', JSON.stringify(levelStats));
                
                playSuccess(xpEarned, attempts);
            } else {
                // Save attempts even on fail
                localStorage.setItem('chero_stats', JSON.stringify(levelStats));
                playFail();
            }
        }

        // Success Animation
        function playSuccess(xpEarned, attempts) {
            const level = levels[currentLevel];
            
            // Mark option as correct
            const optionBtn = document.getElementById('option-' + selectedOption);
            if (optionBtn) {
                optionBtn.classList.add('correct');
            }
            
            // Animate based on level type
            if (level.type === 'if-else') {
                // Heal animation
                const healthBar = document.getElementById('healthBar');
                setTimeout(() => {
                    healthBar.style.width = '100%';
                    healthBar.innerHTML = '❤️ 100 HP';
                }, 300);
                
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.textContent = '💪';
                }, 600);
                
            } else if (level.type === 'pointer') {
                // Door open animation
                const door = document.getElementById('door');
                setTimeout(() => {
                    door.classList.add('open');
                }, 300);
                
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.style.transform = 'translateX(100px)';
                }, 800);
                
            } else if (level.type === 'loop') {
                // Loop animation - hero walks 3 steps
                let steps = level.initialSteps;
                const counter = document.getElementById('stepsCounter');
                
                const walkInterval = setInterval(() => {
                    if (steps > 0) {
                        steps--;
                        counter.textContent = steps;
                    } else {
                        clearInterval(walkInterval);
                        const hero = document.getElementById('hero');
                        hero.textContent = '🎉';
                    }
                }, 400);
                
            } else if (level.type === 'malloc') {
                // Malloc animation - item appears with glow
                const item = document.getElementById('item');
                setTimeout(() => {
                    item.style.opacity = '1';
                    item.style.filter = 'none';
                    item.style.transform = 'scale(1.2)';
                    item.style.transition = 'all 0.5s ease';
                }, 300);
                
                setTimeout(() => {
                    item.style.transform = 'scale(1)';
                }, 800);
                
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.textContent = '😎';
                }, 1000);
            }
            
            // Show result after animation
            setTimeout(() => {
                showResult(true, xpEarned, attempts);
            }, 1500);
        }

        // Fail Animation
        function playFail() {
            const level = levels[currentLevel];
            
            // Mark option as wrong
            const optionBtn = document.getElementById('option-' + selectedOption);
            if (optionBtn) {
                optionBtn.classList.add('wrong');
            }
            
            // Flash error
            const scenePanel = document.getElementById('scenePanel');
            scenePanel.classList.add('error-flash');
            
            // Shake scene
            if (level.type === 'if-else') {
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.textContent = '💀';
                }, 300);
                
            } else if (level.type === 'pointer') {
                const scenePanel = document.getElementById('scenePanel');
                scenePanel.style.animation = 'shake 0.5s ease';
                
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.textContent = '💥';
                }, 300);
                
            } else if (level.type === 'loop') {
                // Infinite loop animation - accelerating hero
                const hero = document.getElementById('hero');
                scenePanel.style.filter = 'blur(3px)';
                
                let rotations = 0;
                const spinInterval = setInterval(() => {
                    rotations += 45;
                    hero.style.transform = `rotate(${rotations}deg)`;
                    if (rotations >= 360) {
                        clearInterval(spinInterval);
                        hero.textContent = '💀';
                        hero.style.transform = 'none';
                    }
                }, 100);
                
            } else if (level.type === 'malloc') {
                // Segfault animation
                scenePanel.style.animation = 'shake 0.5s ease';
                
                const hero = document.getElementById('hero');
                setTimeout(() => {
                    hero.textContent = '💥';
                }, 300);
            }
            
            // Show result after animation
            setTimeout(() => {
                showResult(false);
            }, 1500);
        }

        // Show Result
        function showResult(success, xpEarned = 0, attempts = 0) {
            const level = levels[currentLevel];
            
            if (success && !completedLevels.includes(level.id)) {
                completedLevels.push(level.id);
                localStorage.setItem('chero_completed', JSON.stringify(completedLevels));
            }
            
            // Check if all levels are completed
            const allLevelsCompleted = levels.every(lvl => completedLevels.includes(lvl.id));
            
            // Determine attempt text
            let attemptText = '';
            if (success) {
                if (attempts === 1) attemptText = t('attempt1');
                else if (attempts === 2) attemptText = t('attempt2');
                else attemptText = t('attempt3');
            }
            
            const content = `
                <div class="result-screen fade-in">
                    <div class="result-icon">${success ? '✅' : '❌'}</div>
                    <h2 class="result-title ${success ? 'success' : 'error'}">
                        ${success ? t('level' + level.id + 'SuccessTitle') : t('level' + level.id + 'FailTitle')}
                    </h2>
                    <p class="result-message">
                        ${success ? t('level' + level.id + 'SuccessMessage') : t('level' + level.id + 'FailMessage')}
                    </p>
                    
                    ${success ? `
                        <div style="background: rgba(0, 255, 136, 0.1); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; margin: 20px 0;">
                            <div style="font-size: 2rem; color: var(--primary); font-weight: 900; margin-bottom: 10px;">
                                +${xpEarned} XP
                            </div>
                            <div style="color: var(--text-muted); font-size: 1rem;">
                                ${attemptText}
                            </div>
                        </div>
                        
                        <div class="insight-box">
                            <div class="insight-title">${t('level' + level.id + 'InsightTitle')}</div>
                            <div class="insight-text">${t('level' + level.id + 'Insight')}</div>
                        </div>
                    ` : ''}
                    
                    <div>
                        ${success && !allLevelsCompleted ? `
                            <button class="btn btn-primary" onclick="showMenu()">
                                ${t('nextLevel')}
                            </button>
                        ` : ''}
                        
                        ${success && allLevelsCompleted ? `
                            <button class="btn btn-primary" onclick="showFinal()">
                                ${t('showFinal')}
                            </button>
                        ` : ''}
                        
                        ${!success ? `
                            <button class="btn btn-primary" onclick="showLevel()">
                                ${t('tryAgain')}
                            </button>
                        ` : ''}
                        
                        <button class="btn btn-secondary" onclick="showMenu()">
                            ${t('backToMenu')}
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('gameContent').innerHTML = content;
        }

        // Next Level
        function nextLevel() {
            currentLevel++;
            selectedOption = null;
            showLevel();
        }

        // Final Screen
        function showFinal() {
            const content = `
                <div class="result-screen fade-in">
                    <div class="result-icon">🏆</div>
                    <h2 class="result-title success">${t('finalTitle')}</h2>
                    <p class="result-message">${t('finalMessage')}</p>
                    
                    <div style="background: rgba(0, 255, 136, 0.1); border: 2px solid var(--primary); border-radius: 15px; padding: 30px; margin: 30px 0;">
                        <div style="font-size: 2.5rem; color: var(--primary); font-weight: 900; margin-bottom: 15px;">
                            ${totalXP} XP
                        </div>
                        <div style="color: var(--text-muted); font-size: 1.1rem;">
                            ${t('totalXP')}
                        </div>
                    </div>
                    
                    <div class="insight-box">
                        <div class="insight-title">${t('finalLearned')}</div>
                        <div class="insight-text" style="text-align: left;">
                            • ${t('finalSkill1')}<br>
                            • ${t('finalSkill2')}<br>
                            • ${t('finalSkill3')}<br>
                            • ${t('finalSkill4')}
                        </div>
                    </div>
                    
                    <div class="insight-box" style="background: rgba(0, 212, 255, 0.1); border-color: var(--accent);">
                        <div class="insight-title" style="color: var(--accent);">${t('finalNextTitle')}</div>
                        <div class="insight-text">${t('finalNextMessage')}</div>
                    </div>
                    
                    <div style="margin-top: 30px;">
                        <button class="btn btn-primary" onclick="showMenu()">
                            ${t('finalButton')}
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('gameContent').innerHTML = content;
        }

        // Statistics
        function showStats() {
            const content = `
                <div class="result-screen fade-in">
                    <h2 class="result-title" style="color: var(--primary);">${t('statsTitle')}</h2>
                    
                    <div style="text-align: left; margin: 30px 0;">
                        ${levels.map(level => {
                            const stats = levelStats[level.id] || { attempts: 0, bestXP: 0, completed: false };
                            return `
                                <div style="background: var(--bg-light); border: 2px solid rgba(0, 255, 136, 0.2); border-radius: 10px; padding: 20px; margin-bottom: 15px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                        <div style="font-size: 1.2rem; font-weight: 700;">${t('level' + level.id + 'Title')}</div>
                                        <div>${stats.completed ? t('statsCompleted') : t('statsNotCompleted')}</div>
                                    </div>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; color: var(--text-muted);">
                                        <div>${t('statsAttempts')}: ${stats.attempts}</div>
                                        <div>${t('statsBestXP')}: ${stats.bestXP} XP</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div style="background: rgba(0, 255, 136, 0.1); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; margin: 20px 0;">
                        <div style="font-size: 1.5rem; color: var(--primary); font-weight: 900;">
                            ${t('totalXP')}: ${totalXP} XP
                        </div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="showMenu()">
                        ${t('statsClose')}
                    </button>
                </div>
            `;
            
            document.getElementById('gameContent').innerHTML = content;
        }

        // Reset Progress Confirmation
        function confirmReset() {
            const content = `
                <div class="result-screen fade-in">
                    <div class="result-icon">⚠️</div>
                    <h2 class="result-title" style="color: var(--accent);">${t('resetTitle')}</h2>
                    <p class="result-message">${t('resetMessage')}</p>
                    
                    <div style="margin-top: 30px;">
                        <button class="btn" style="background: var(--error); color: white; margin: 10px;" onclick="resetProgress()">
                            ${t('resetConfirm')}
                        </button>
                        <button class="btn btn-secondary" onclick="showMenu()">
                            ${t('resetCancel')}
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('gameContent').innerHTML = content;
        }

        // Reset Progress
        function resetProgress() {
            // Clear all data
            localStorage.removeItem('chero_completed');
            localStorage.removeItem('chero_totalXP');
            localStorage.removeItem('chero_stats');
            
            // Reset variables
            completedLevels = [];
            totalXP = 0;
            levelStats = {};
            
            // Reinitialize stats
            levels.forEach(level => {
                levelStats[level.id] = {
                    attempts: 0,
                    bestXP: 0,
                    completed: false
                };
            });
            
            // Show menu
            showMenu();
        }

        // Initialize
        startGame();
    </script>
</body>
</html>
