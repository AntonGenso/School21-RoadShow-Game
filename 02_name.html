<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enter Name — Code Invaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint: #00FFAF;
      --mint-glow: rgba(0, 255, 175, 0.25);
      --bg: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1a1a1a;
      --text: #ffffff;
      --text-dim: #888888;
      --error: #ff4d4d;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      overflow-x: hidden;
    }

    /* STARFIELD */
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* SCANLINES */
    .scanlines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
    }

    /* LAYOUT */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 36px 24px;
    }

    /* BACK BUTTON */
    .back-btn {
      position: absolute; top: 24px; left: 24px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 8px;
      color: var(--text-dim);
      font-family: "Share Tech Mono", monospace;
      font-size: 11px; letter-spacing: 0.2em;
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: flex; align-items: center; gap: 6px;
      z-index: 10;
    }
    .back-btn:hover { border-color: var(--mint); color: var(--mint); }

    /* CARD */
    .card {
      width: 100%; max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 28px;
      display: flex; flex-direction: column; align-items: center; gap: 28px;
      animation: cardIn 0.5s ease both;
      position: relative; overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* LOGO */
    .logo-wrap {
      width: 90px; height: 74px;
      display: flex; align-items: center; justify-content: center;
      animation: logoGlow 3s ease-in-out infinite;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 8px var(--mint)); }
      50%       { filter: drop-shadow(0 0 20px var(--mint)); }
    }

    /* TITLE */
    .title-block { text-align: center; }
    .title {
      font-size: 20px; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text); line-height: 1.2;
    }
    .title span { color: var(--mint); }
    .subtitle {
      font-size: 10px; letter-spacing: 0.3em;
      color: var(--text-dim); margin-top: 8px;
      font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
    }

    /* INPUT BLOCK */
    .input-block { width: 100%; display: flex; flex-direction: column; gap: 8px; }

    .input-label {
      font-size: 9px; letter-spacing: 0.35em;
      color: var(--mint); text-transform: uppercase;
      font-family: "Share Tech Mono", monospace;
    }

    .input-wrap { position: relative; }

    .name-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--mint);
      font-family: "Share Tech Mono", monospace;
      font-size: 18px; letter-spacing: 0.1em;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--mint);
    }
    .name-input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 16px var(--mint-glow);
    }
    .name-input.error {
      border-color: var(--error);
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.25);
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .char-count {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 10px; font-family: "Share Tech Mono", monospace;
      color: #444;
    }

    /* STATUS MESSAGE */
    .status-msg {
      font-size: 10px; letter-spacing: 0.2em;
      font-family: "Share Tech Mono", monospace;
      text-transform: uppercase;
      min-height: 16px;
      transition: color 0.2s;
    }
    .status-msg.error { color: var(--error); }
    .status-msg.checking { color: var(--text-dim); }
    .status-msg.ok { color: var(--mint); }

    /* START BUTTON */
    .start-btn {
      width: 100%;
      padding: 14px 20px;
      background: transparent;
      border: 1px solid var(--mint);
      border-radius: 10px;
      color: var(--mint);
      font-family: "Orbitron", sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.25em;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, opacity 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .start-btn:hover:not(:disabled) {
      background: var(--mint); color: #000;
      box-shadow: 0 0 24px var(--mint-glow);
    }
    .start-btn:disabled {
      opacity: 0.3; cursor: not-allowed; border-color: #333; color: #333;
    }
    .start-btn .arrow { transition: transform 0.2s; }
    .start-btn:hover:not(:disabled) .arrow { transform: translateX(5px); }

    /* Floating mode — когда клавиатура открыта */
    .start-btn.floating {
      position: fixed;
      left: 16px; right: 16px;
      width: auto;
      z-index: 100;
      background: #000;
      border-color: var(--mint);
      box-shadow: 0 0 24px var(--mint-glow), 0 -4px 20px rgba(0,0,0,0.8);
      transition: bottom 0.15s ease, background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    /* LOADING SPINNER */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .start-btn.loading .spinner { display: block; }
    .start-btn.loading .btn-text { display: none; }
    .start-btn.loading .arrow { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="starfield" id="starfield"></div>

<button class="back-btn" onclick="window.location.href='01_hub.html'">← BACK</button>

<div class="page">
  <div class="card">

    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/AntonGenso/School21-RoadShow-Game/main/screen01/logo.png" alt="School 21">
    </div>

    <div class="title-block">
      <div class="title">Code <span>Invaders</span></div>
      <div class="subtitle">// Enter your callsign to begin</div>
    </div>

    <div class="input-block">
      <div class="input-label">// your name</div>
      <div class="input-wrap">
        <input
          class="name-input"
          id="nameInput"
          type="text"
          maxlength="12"
          placeholder="Alex"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          oninput="onNameInput()"
        >
        <span class="char-count" id="charCount">0/12</span>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <button class="start-btn" id="startBtn" disabled onclick="startGame()">
      <span class="spinner"></span>
      <span class="btn-text">START GAME</span>
      <span class="arrow">→</span>
    </button>

  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqHiiaHlGXbU0xFClfG7QWgy8u3sPWbUw",
    authDomain: "school21-roadshow.firebaseapp.com",
    databaseURL: "https://school21-roadshow-default-rtdb.firebaseio.com",
    projectId: "school21-roadshow",
    storageBucket: "school21-roadshow.firebasestorage.app",
    messagingSenderId: "869790309000",
    appId: "1:869790309000:web:d1b900402c211a93371d3d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let checkTimer = null;
  let currentName = "";
  let nameValid = false;

  window.onNameInput = function() {
    const input = document.getElementById("nameInput");
    const val = input.value.trim();
    const charCount = document.getElementById("charCount");
    const statusMsg = document.getElementById("statusMsg");
    const startBtn = document.getElementById("startBtn");

    charCount.textContent = `${input.value.length}/12`;
    currentName = val;
    nameValid = false;
    startBtn.disabled = true;

    input.classList.remove("error");
    statusMsg.className = "status-msg";
    statusMsg.textContent = "";

    if (val.length === 0) return;

    if (val.length < 2) {
      statusMsg.className = "status-msg error";
      statusMsg.textContent = "// min 2 characters";
      return;
    }

    // Debounce check
    clearTimeout(checkTimer);
    statusMsg.className = "status-msg checking";
    statusMsg.textContent = "// checking...";

    checkTimer = setTimeout(async () => {
      if (val !== currentName) return;
      try {
        const snapshot = await get(ref(db, `players/${val.toLowerCase()}`));
        if (snapshot.exists()) {
          input.classList.add("error");
          statusMsg.className = "status-msg error";
          statusMsg.textContent = `// "${val}" is taken, try another`;
          nameValid = false;
          startBtn.disabled = true;
        } else {
          statusMsg.className = "status-msg ok";
          statusMsg.textContent = "// name available ✓";
          nameValid = true;
          startBtn.disabled = false;
        }
      } catch (e) {
        // If Firebase fails, allow anyway
        nameValid = true;
        startBtn.disabled = false;
        statusMsg.textContent = "";
      }
    }, 600);
  };

  window.startGame = async function() {
    if (!nameValid || !currentName) return;

    const startBtn = document.getElementById("startBtn");
    startBtn.classList.add("loading");
    startBtn.disabled = true;

    try {
      // Reserve the name in Firebase
      await set(ref(db, `players/${currentName.toLowerCase()}`), {
        name: currentName,
        score: 0,
        status: "playing",
        timestamp: Date.now()
      });

      // Save to sessionStorage for use across screens
      sessionStorage.setItem("playerName", currentName);

      // Go to gameplay
      window.location.href = "03_gameplay.html";
    } catch (e) {
      // If Firebase fails, continue anyway
      sessionStorage.setItem("playerName", currentName);
      window.location.href = "03_gameplay.html";
    }
  };

  window.goBack = function() {
    window.location.href = "01_hub.html";
  };
</script>

<script>
  // Starfield
  const starfield = document.getElementById("starfield");
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    starfield.appendChild(s);
  }

  // ── Кнопка START переезжает над клавиатурой ──
  const startBtn = document.getElementById("startBtn");
  const PADDING = 12; // отступ от края клавиатуры

  function onViewportResize() {
    const vv = window.visualViewport;
    if (!vv) return;

    const windowHeight = window.innerHeight;
    const viewportHeight = vv.height;
    const keyboardHeight = windowHeight - viewportHeight - vv.offsetTop;

    if (keyboardHeight > 100) {
      // Клавиатура открыта — фиксируем кнопку над ней
      startBtn.classList.add("floating");
      startBtn.style.bottom = `${keyboardHeight + PADDING}px`;
    } else {
      // Клавиатура закрыта — возвращаем в карточку
      startBtn.classList.remove("floating");
      startBtn.style.bottom = "";
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onViewportResize);
    window.visualViewport.addEventListener("scroll", onViewportResize);
  }
</script>

</body>
</html>
