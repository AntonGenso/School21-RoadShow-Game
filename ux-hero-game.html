<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Hero: Design Sprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366F1;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --bg: #0F172A;
            --bg-light: #1E293B;
            --bg-card: #334155;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --accent: #EC4899;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                linear-gradient(225deg, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease-out;
        }
        
        .game-header-center {
            text-align: center;
            flex: 1;
        }
        
        .lang-button {
            padding: 10px 20px;
            background: var(--bg-light);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .lang-button:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .game-title {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Progress bar */
        .career-progress {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .career-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .career-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .career-details h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .career-level {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .xp-bar {
            flex: 1;
            max-width: 300px;
            margin-left: 30px;
        }

        .xp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .xp-track {
            height: 12px;
            background: var(--bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .xp-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Mission card */
        .mission-card {
            background: var(--bg-light);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .mission-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .mission-client {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mission-reward {
            text-align: right;
        }

        .reward-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reward-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .mission-problem {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--error);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .mission-problem strong {
            color: var(--error);
        }

        /* Game screen */
        .game-screen {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            min-height: 400px;
            animation: fadeInUp 0.6s ease-out 0.6s both;
        }

        .screen-title {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Phone mockup */
        .phone-container {
            max-width: 340px;
            margin: 0 auto;
        }

        .phone-mockup {
            background: #1F1F1F;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .phone-screen {
            background: #FFFFFF;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
        }

        .app-header {
            background: #F8F9FA;
            padding: 15px 20px;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-weight: 600;
            color: #1F2937;
            font-size: 1rem;
        }

        .app-content {
            padding: 25px 20px;
            min-height: 400px;
        }

        /* Interactive elements */
        .interactive-button {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: block;
            width: 100%;
        }

        .btn-bad {
            background: #E5E7EB;
            color: #6B7280;
            font-size: 0.75rem;
            padding: 8px 16px;
        }

        .btn-fixed {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: scale(1.05);
        }

        .btn-fixed:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .choice-buttons {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 18px 20px;
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .choice-btn.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            animation: correctPulse 0.5s;
        }

        .choice-btn.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            animation: shake 0.5s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Form elements */
        .form-field {
            margin-bottom: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .form-field:hover {
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            padding: 5px;
            margin: 0 -5px 15px -5px;
        }

        .form-field:hover::after {
            content: '❌ Удалить';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: var(--error);
            font-weight: 600;
            background: var(--bg);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
        }

        .form-label {
            display: block;
            color: #374151;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #1F2937;
        }

        .form-field.unnecessary {
            opacity: 0.5;
            position: relative;
        }

        .form-field.unnecessary::after {
            content: '❌ Лишнее';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: var(--error);
            font-weight: 600;
        }

        .delete-btn {
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: var(--error);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
        }

        .form-field:hover .delete-btn {
            display: block;
        }

        /* Result screen */
        .result-screen {
            text-align: center;
            padding: 30px;
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .result-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .metric-change {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .metric-change.up {
            color: var(--success);
        }

        .metric-change.down {
            color: var(--error);
        }

        .user-feedback {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            padding: 15px 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            font-style: italic;
        }

        .lesson-box {
            background: rgba(99, 102, 241, 0.1);
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            margin: 25px 0;
        }

        .lesson-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lesson-text {
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            * {
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                overflow-x: hidden !important;
            }

            body {
                font-size: 14px;
                padding: 0 !important;
                margin: 0 !important;
            }

            .container {
                padding: 10px !important;
                max-width: 100% !important;
                margin: 0 auto !important;
            }

            /* Mission Description Cards */
            .fade-in > div:first-child {
                padding: 15px !important;
                margin-bottom: 15px !important;
            }

            .fade-in > div:first-child h3 {
                font-size: 1.1rem !important;
                word-wrap: break-word !important;
                line-height: 1.3 !important;
            }

            .fade-in > div:first-child p {
                font-size: 0.85rem !important;
                line-height: 1.4 !important;
            }

            .fade-in > div:first-child > div {
                padding: 12px !important;
                margin-top: 12px !important;
            }

            .fade-in > div:first-child > div > div:first-child {
                font-size: 0.9rem !important;
            }

            .fade-in > div:first-child > div > div:last-child {
                font-size: 0.8rem !important;
            }

            /* Header */
            .game-header {
                flex-direction: column !important;
                gap: 12px !important;
                padding: 15px 10px !important;
                text-align: center;
                margin-bottom: 20px !important;
            }
            
            .game-header > div:first-child {
                display: none !important; /* Скрываем spacer */
            }

            .game-header-center {
                width: 100% !important;
            }

            .game-title {
                font-size: 1.75rem !important;
                margin-bottom: 5px !important;
            }

            .game-subtitle {
                font-size: 0.85rem !important;
            }
            
            .lang-button {
                width: auto !important;
                max-width: 180px !important;
                margin: 0 auto !important;
                padding: 8px 16px !important;
                font-size: 0.9rem !important;
            }

            /* Career Progress */
            .career-progress {
                flex-direction: column !important;
                align-items: flex-start !important;
                padding: 15px !important;
                gap: 12px !important;
                margin-bottom: 20px !important;
            }

            .career-info {
                width: 100% !important;
                display: flex !important;
                align-items: center !important;
                gap: 12px !important;
            }

            .career-icon {
                font-size: 2.5rem !important;
                width: 55px !important;
                height: 55px !important;
                min-width: 55px !important;
            }

            .career-details {
                flex: 1 !important;
            }

            .career-title {
                font-size: 1.05rem !important;
                margin-bottom: 4px !important;
            }

            .career-level {
                font-size: 0.75rem !important;
            }

            .xp-bar {
                margin-left: 0 !important;
                margin-top: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .xp-label {
                font-size: 0.75rem !important;
            }

            .xp-fill {
                height: 8px !important;
            }

            /* Buttons */
            .action-buttons {
                flex-direction: column !important;
                gap: 10px !important;
                width: 100% !important;
            }
            
            .action-buttons .btn {
                width: 100% !important;
            }

            .btn {
                padding: 12px 20px !important;
                font-size: 0.9rem !important;
                white-space: nowrap;
            }

            /* Mission Cards */
            .mission-card {
                padding: 15px !important;
                margin-bottom: 15px !important;
            }

            .mission-header {
                flex-direction: column !important;
                gap: 12px !important;
                align-items: flex-start !important;
            }

            .mission-title {
                font-size: 1.2rem !important;
                line-height: 1.3 !important;
            }

            .mission-client {
                font-size: 0.8rem !important;
            }

            .difficulty-badge {
                font-size: 0.7rem !important;
                padding: 4px 8px !important;
            }

            .mission-description {
                font-size: 0.9rem !important;
                line-height: 1.5 !important;
            }

            /* Options */
            .options-grid {
                grid-template-columns: 1fr !important;
                gap: 10px !important;
            }

            .option-card {
                padding: 12px !important;
            }

            .option-title {
                font-size: 0.95rem !important;
            }

            .option-description {
                font-size: 0.8rem !important;
                line-height: 1.4 !important;
            }

            /* AB Test */
            .ab-test-container {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
            }

            .variant-card {
                padding: 12px !important;
            }

            .variant-label {
                font-size: 0.85rem !important;
                padding: 5px 10px !important;
            }

            /* Phone Mockups */
            .phone-mockup {
                max-width: 260px !important;
                margin: 0 auto !important;
            }

            .phone-screen {
                padding: 12px !important;
            }

            .phone-screen h3 {
                font-size: 0.9rem !important;
            }

            .phone-screen p {
                font-size: 0.75rem !important;
            }

            .phone-screen button,
            .phone-screen input {
                font-size: 0.8rem !important;
                padding: 8px !important;
            }

            /* Results */
            .results-content {
                padding: 15px !important;
            }

            .results-title {
                font-size: 1.4rem !important;
            }

            .xp-display {
                font-size: 2rem !important;
                padding: 15px !important;
            }

            .metrics-grid {
                grid-template-columns: 1fr !important;
                gap: 10px !important;
            }

            .metric-card {
                padding: 12px !important;
            }

            .metric-value {
                font-size: 1.5rem !important;
            }

            .metric-label {
                font-size: 0.8rem !important;
            }

            /* Final Screen */
            .final-screen {
                padding: 25px 12px !important;
            }

            .final-title {
                font-size: 1.75rem !important;
            }

            .final-subtitle {
                font-size: 0.95rem !important;
            }

            .stats-grid {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
            }

            .stat-card {
                padding: 15px !important;
            }

            .stat-value {
                font-size: 1.75rem !important;
            }

            .skills-list {
                padding: 12px !important;
            }

            .skill-item {
                padding: 10px !important;
                font-size: 0.85rem !important;
            }

            /* Statistics Modal */
            .stats-modal {
                padding: 10px !important;
            }

            .stats-content {
                padding: 15px !important;
                max-height: 65vh !important;
                overflow-y: auto !important;
            }

            .stats-title {
                font-size: 1.4rem !important;
            }

            .stats-table {
                font-size: 0.8rem !important;
            }

            .stats-table th,
            .stats-table td {
                padding: 8px 5px !important;
            }

            /* Language Selection */
            .language-selection {
                padding: 15px !important;
            }

            .language-card {
                padding: 25px 15px !important;
            }

            .language-icon {
                font-size: 3.5rem !important;
                margin-bottom: 20px !important;
            }

            .language-title {
                font-size: 1.75rem !important;
            }

            .language-subtitle {
                font-size: 0.9rem !important;
            }

            .language-buttons {
                gap: 12px !important;
            }

            .language-btn {
                font-size: 1rem !important;
                padding: 15px !important;
            }

            /* Mission Menu */
            .mission-menu {
                padding: 10px !important;
            }

            .menu-title {
                font-size: 1.5rem !important;
                word-wrap: break-word !important;
            }

            .menu-subtitle {
                font-size: 0.85rem !important;
            }

            /* Mission Cards in Menu */
            .mission-card h3 {
                font-size: 1.1rem !important;
                line-height: 1.3 !important;
                word-wrap: break-word !important;
            }

            .mission-card .difficulty-badge {
                font-size: 0.7rem !important;
            }
        }
            }

            /* Statistics Modal */
            .stats-content {
                padding: 20px;
                max-height: 70vh;
                overflow-y: auto;
            }

            .stats-table {
                font-size: 0.85rem;
            }

            /* Language Selection */
            .language-selection {
                padding: 20px;
            }

            .language-card {
                padding: 30px 20px;
            }

            .language-icon {
                font-size: 4rem;
            }

            .language-title {
                font-size: 2rem;
            }

            .language-btn {
                font-size: 1.1rem;
                padding: 18px;
            }
        }

        .btn {
            padding: 15px 35px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {

            const completedCount = completedMissions.length;

            // Считаем общее количество попыток
            let totalAttempts = 0;
            let totalBestXP = 0;
            let averageTime = 0;
            let timeCount = 0;
            
            Object.values(missionStats).forEach(stat => {
                totalAttempts += stat.attempts;
                totalBestXP += stat.bestXP;
                if (stat.bestTime !== null) {
                    averageTime += stat.bestTime;
                    timeCount++;
                }
            });
            
            averageTime = timeCount > 0 ? Math.floor(averageTime / timeCount) : 0;
            
            return {
                totalXP: totalXP,
                careerStage: careerStage,
                careerTitle: t(careerStages[careerStage].titleKey),
                completedMissions: completedCount,
                totalMissions: totalMissions,
                completionRate: Math.floor((completedCount / totalMissions) * 100),
                totalAttempts: totalAttempts,
                averageBestXP: totalMissions > 0 ? Math.floor(totalBestXP / totalMissions) : 0,
                averageTime: averageTime,
                missionStats: missionStats,
                timestamp: new Date().toISOString()
            };

        function fixButton(choice) {
            buttonFixAttempts++;
            
            const buttons = document.querySelectorAll('.choice-btn');
            const button = document.querySelector('#buttonContainer button');
            if (!button) return;

            if (choice === 'all') {
                // Правильный ответ!
                buttons.forEach(btn => btn.style.pointerEvents = 'none');
                
                button.textContent = t('mission1OrderButtonFixed');
                button.className = 'interactive-button btn-fixed';
                
                const correctBtn = document.querySelector(`[onclick="fixButton('all')"]`);
                if (correctBtn) correctBtn.classList.add('correct');
                
                // XP зависит от попытки
                const xp = buttonFixAttempts === 1 ? 100 : (buttonFixAttempts === 2 ? 80 : (buttonFixAttempts === 3 ? 60 : 50));
                
                setTimeout(() => {
                    showResult(true, xp, '18%', '2%');
                }, 800);
            } else {
                // Неправильный ответ
                const incorrectBtn = document.querySelector(`[onclick="fixButton('${choice}')"]`);
                if (incorrectBtn) {
                    incorrectBtn.classList.add('incorrect');
                    
                    // Анимация тряски
                    incorrectBtn.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        incorrectBtn.style.animation = '';
                        incorrectBtn.classList.remove('incorrect');
                    }, 500);
                }
                
                if (buttonFixAttempts >= 3) {
                    // 3 попытки использованы - показываем правильный ответ и завершаем с минимальными баллами
                    setTimeout(() => {
                        buttons.forEach(btn => btn.style.pointerEvents = 'none');
                        
                        const correctBtn = document.querySelector(`[onclick="fixButton('all')"]`);
                        if (correctBtn) {
                            correctBtn.classList.add('correct');
                            correctBtn.style.animation = 'correctPulse 0.5s infinite';
                        }
                        
                        button.textContent = t('mission1OrderButtonFixed');
                        button.className = 'interactive-button btn-fixed';
                        
                        setTimeout(() => {
                            showResult(false, 50, '15%', '2%');
                        }, 1500);
                    }, 600);
                }
                // Если меньше 3 попыток - просто подсвечиваем неправильный и даём попробовать ещё
            }
        }

        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval); // Clear any existing timer
            timeLeft = 45;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                const timerEl = document.getElementById('timer');
                if (timerEl) {
                    timerEl.textContent = timeLeft;
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkFormSimplification();
                }
            }, 1000);
        }

        let removedFields = [];

        function removeField(field) {
            const fieldName = field.dataset.field;
            const isNecessary = field.dataset.necessary === 'true';
            
            // Сохраняем информацию об удалённом поле
            removedFields.push({
                field: fieldName,
                necessary: isNecessary
            });
            
            // Анимация удаления
            field.style.animation = 'fadeOut 0.3s';
            field.style.pointerEvents = 'none';
            
            setTimeout(() => {
                field.remove();
                updateFieldsCount();
            }, 300);
        }

        function updateFieldsCount() {
            const remaining = document.querySelectorAll('.form-field').length;
            const removed = removedFields.length;
            
            const remainingEl = document.getElementById('fieldsCount');
            const removedEl = document.getElementById('removedCount');
            
            if (remainingEl) remainingEl.textContent = remaining;
            if (removedEl) removedEl.textContent = removed;
        }

        function finishFormSimplification() {
            clearInterval(timerInterval);
            
            // Подсчитываем результат
            let correctRemoved = 0;
            let wrongRemoved = 0;
            let shouldRemain = ['email', 'password'];
            
            removedFields.forEach(item => {
                if (item.necessary) {
                    wrongRemoved++; // Удалили важное поле!
                } else {
                    correctRemoved++; // Правильно удалили лишнее
                }
            });
            
            // Проверяем что осталось
            const remaining = Array.from(document.querySelectorAll('.form-field'))
                .map(field => field.dataset.field);
            
            const totalUnnecessary = 7; // Всего лишних полей
            const score = correctRemoved * 20 - wrongRemoved * 30;
            const maxScore = 150;
            
            // Определяем результат
            if (wrongRemoved === 0 && correctRemoved === totalUnnecessary) {
                // Идеально!
                showFormResult(true, maxScore, correctRemoved, wrongRemoved);
            } else if (wrongRemoved === 0 && correctRemoved >= 4) {
                // Хорошо, но не всё удалили
                showFormResult(false, Math.max(score, 100), correctRemoved, wrongRemoved);
            } else if (wrongRemoved > 0) {
                // Удалили важные поля - плохо!
                showFormResult(false, Math.max(score, 50), correctRemoved, wrongRemoved);
            } else {
                // Почти ничего не удалили
                showFormResult(false, 50, correctRemoved, wrongRemoved);
            }
        }

        function showFormResult(perfect, xp, correctRemoved, wrongRemoved) {
            const mission = missions[currentLevel];
            
            // Считаем время прохождения
            const completionTime = missionStartTime ? Math.floor((Date.now() - missionStartTime) / 1000) : 0;
            
            // Определяем успех (проходной балл 70 XP)
            const success = xp >= 70;
            
            // Добавляем XP
            totalXP += xp;
            updateXP();
            
            // Сохраняем миссию как пройденную (даже с плохим результатом)
            if (!completedMissions.includes(mission.id)) {
                completedMissions.push(mission.id);
                localStorage.setItem('uxhero_completed', JSON.stringify(completedMissions));
            }
            
            // Обновляем статистику миссии
            const stats = missionStats[mission.id];
            stats.completions++;
            stats.totalXP += xp;
            
            // Обновляем лучший результат
            if (xp > stats.bestXP) {
                stats.bestXP = xp;
            }
            
            // Обновляем лучшее время (только если успешно)
            if (success && (stats.bestTime === null || completionTime < stats.bestTime)) {
                stats.bestTime = completionTime;
            }
            
            // Сохраняем статистику
            localStorage.setItem('uxhero_stats', JSON.stringify(missionStats));
            
            // Обновляем общее XP в localStorage для лидерборда

                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-secondary" onclick="showMissionMenu()">
                                📋 ${t('backToMenu')}
                            </button>
                            <button class="btn btn-secondary" onclick="retryLevel()">
                                🔄 ${t('tryAgain')}
                            </button>
                            ${completedMissions.length === missions.length ? `
                                <button class="btn btn-primary" onclick="showFinalScreen()">
                                    ${t('finish')}
                                </button>
                            ` : `
                                <button class="btn btn-primary" onclick="nextMission()">
                                    ${currentLevel < missions.length - 1 ? t('nextTask') : t('continue')}
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('gameContent').innerHTML = content;
        }
        
        function retryLevel() {
            // Сбрасываем попытки для всех уровней
            buttonFixAttempts = 0;
            abTestAttempts = 0;
            priorityAttempts = 0;
            selectedAB = null;
            removedFields = [];
            
            // Don't increment level, just restart current mission
            showMissionBrief();
        }

        function updateXP() {
            const currentStage = careerStages[careerStage];
            const progress = (totalXP / currentStage.xpNeeded) * 100;

            document.getElementById('xpFill').style.width = Math.min(progress, 100) + '%';
            document.getElementById('xpText').textContent = `${totalXP} / ${currentStage.xpNeeded}`;

            if (totalXP >= currentStage.xpNeeded && careerStage < careerStages.length - 1) {
                levelUp();
            }
        }

        function levelUp() {
            careerStage++;
            const newStage = careerStages[careerStage];
            
            document.getElementById('careerTitle').textContent = newStage.title;
            document.getElementById('careerLevel').textContent = `Level ${careerStage + 1}`;
            document.querySelector('.career-icon').textContent = newStage.icon;

            // Animation
            document.querySelector('.career-progress').style.animation = 'none';
            setTimeout(() => {
                document.querySelector('.career-progress').style.animation = 'fadeInDown 0.6s ease-out';
            }, 10);

            updateXP();
        }

        function nextMission() {
            currentLevel++;
            
            if (currentLevel >= missions.length) {
                showFinalScreen();
            } else {
                showMissionBrief();
            }
        }

        function showFinalScreen() {
            const content = `
                <div class="game-screen">
                    <div class="result-screen">
                        <div class="result-icon">🏆</div>
                        <h2 class="result-title">${t('congratulationsTitle')}</h2>
                        
                        <p style="font-size: 1.2rem; color: var(--text-muted); margin: 20px 0;">
                            ${t('finalMessage')} <strong style="color: var(--primary);">${t('uxHero')}</strong>!
                        </p>
                        
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <div class="metric-label">${t('totalExperience')}</div>
                                <div class="metric-value" style="color: var(--accent);">${totalXP} XP</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">${t('career')}</div>
                                <div class="metric-value">${careerStages[careerStage].icon} ${t(careerStages[careerStage].titleKey)}</div>
                            </div>
                        </div>
                        
                        <div class="lesson-box">
                            <div class="lesson-title">${t('youLearned')}</div>
                            <div class="lesson-text">
                                ${t('learnedSkills')}
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="showMissionMenu()">
                                ${t('backToMenuFinal')}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('gameContent').innerHTML = content;
        }

        // Start the game
        startGame();
    </script>
</body>
</html>
