<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Over — Code Invaders</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint: #00FFAF;
      --mint-glow: rgba(0, 255, 175, 0.35);
      --bg: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1a1a1a;
      --text: #ffffff;
      --text-dim: #888888;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      overflow: hidden;
    }

    /* STARFIELD */
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    /* SCANLINES */
    .scanlines {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
    }

    /* CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
    }

    /* LAYOUT */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 36px 24px;
      gap: 0;
    }

    /* CARD */
    .card {
      width: 100%; max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 28px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      position: relative; overflow: hidden;
      animation: cardIn 0.5s ease both;
    }

    .card::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--mint), transparent);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* LOGO */
    .logo-wrap {
      width: 80px; height: 66px;
      display: flex; align-items: center; justify-content: center;
      animation: logoGlow 3s ease-in-out infinite;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 8px var(--mint)); }
      50%       { filter: drop-shadow(0 0 20px var(--mint)); }
    }

    /* GAME OVER LABEL */
    .gameover-label {
      font-size: 11px; letter-spacing: 0.4em;
      color: var(--text-dim); text-transform: uppercase;
      font-family: "Share Tech Mono", monospace;
    }

    /* SCORE BLOCK */
    .score-block {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      width: 100%;
    }

    .score-title {
      font-size: 10px; letter-spacing: 0.4em;
      color: var(--text-dim); text-transform: uppercase;
      font-family: "Share Tech Mono", monospace;
    }

    .score-number {
      font-size: clamp(56px, 18vw, 80px);
      font-weight: 900; letter-spacing: -0.02em;
      color: var(--mint);
      line-height: 1;
      transition: text-shadow 0.3s ease;
    }

    .score-number.glow {
      text-shadow:
        0 0 20px var(--mint),
        0 0 40px var(--mint),
        0 0 80px var(--mint-glow);
      animation: scorePulse 0.6s ease;
    }

    @keyframes scorePulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.08); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    /* RANK BLOCK */
    .rank-block {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      opacity: 0;
      animation: fadeUp 0.5s ease both;
      animation-delay: 0.1s;
    }
    .rank-block.visible { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .rank-emoji { font-size: 36px; line-height: 1; }

    .rank-label {
      font-size: 16px; font-weight: 700; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }

    .rank-sub {
      font-size: 10px; letter-spacing: 0.25em;
      color: var(--text-dim); text-transform: uppercase;
      font-family: "Share Tech Mono", monospace;
    }

    /* DIVIDER */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #222, transparent);
    }

    /* BUTTONS */
    .btn-group {
      width: 100%; display: flex; flex-direction: column; gap: 12px;
    }

    .btn {
      width: 100%; padding: 14px 20px;
      border-radius: 10px;
      font-family: "Orbitron", sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .btn-primary {
      background: var(--mint); color: #000;
      border: 1px solid var(--mint);
      box-shadow: 0 0 20px var(--mint-glow);
    }
    .btn-primary:hover { box-shadow: 0 0 32px var(--mint); transform: translateY(-2px); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      background: transparent; color: var(--mint);
      border: 1px solid var(--mint);
    }
    .btn-secondary:hover {
      background: rgba(0,255,175,0.08);
      box-shadow: 0 0 16px var(--mint-glow);
      transform: translateY(-2px);
    }
    .btn-secondary:active { transform: scale(0.98); }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="starfield" id="starfield"></div>
<canvas id="confettiCanvas"></canvas>

<div class="page">
  <div class="card">

    <div class="logo-wrap">
      <img src="https://raw.githubusercontent.com/AntonGenso/School21-RoadShow-Game/main/screen01/logo.png" alt="School 21">
    </div>

    <div class="gameover-label">// mission complete</div>

    <div class="score-block">
      <div class="score-title">// final score</div>
      <div class="score-number" id="scoreNumber">0</div>
    </div>

    <div class="rank-block" id="rankBlock">
      <div class="rank-emoji" id="rankEmoji">😅</div>
      <div class="rank-label" id="rankLabel">Intern</div>
      <div class="rank-sub" id="rankSub">keep coding!</div>
    </div>

    <div class="divider"></div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="playAgain()">
        ↩ PLAY AGAIN
      </button>
      <button class="btn btn-secondary" onclick="goLeaderboard()">
        🏆 LEADERBOARD
      </button>
    </div>

  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqHiiaHlGXbU0xFClfG7QWgy8u3sPWbUw",
    authDomain: "school21-roadshow.firebaseapp.com",
    databaseURL: "https://school21-roadshow-default-rtdb.firebaseio.com",
    projectId: "school21-roadshow",
    storageBucket: "school21-roadshow.firebasestorage.app",
    messagingSenderId: "869790309000",
    appId: "1:869790309000:web:d1b900402c211a93371d3d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Get score and name from sessionStorage or URL (for testing)
  const urlParams = new URLSearchParams(window.location.search);
  const finalScore = parseInt(urlParams.get("score") || sessionStorage.getItem("finalScore") || "0");
  const playerName = sessionStorage.getItem("playerName") || "TestPlayer";

  // Save to Firebase immediately
  async function saveScore() {
    try {
      await update(ref(db, `players/${playerName.toLowerCase()}`), {
        name: playerName,
        score: finalScore,
        status: "finished",
        timestamp: Date.now()
      });
    } catch (e) {
      console.log("Firebase save failed:", e);
    }
  }

  saveScore();

  // Rank logic
  function getRank(score) {
    if (score >= 3000) return { emoji: "🏆", label: "Senior Dev", sub: "legendary!" };
    if (score >= 2000) return { emoji: "💻", label: "Mid Dev", sub: "impressive!" };
    if (score >= 1000) return { emoji: "🌱", label: "Junior Dev", sub: "great job!" };
    return { emoji: "😅", label: "Intern", sub: "keep coding!" };
  }

  // Animate score counter
  function animateScore(target, duration) {
    const el = document.getElementById("scoreNumber");
    const start = performance.now();
    const easeOut = t => 1 - Math.pow(1 - t, 3);

    function update(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const current = Math.floor(easeOut(progress) * target);
      el.textContent = current.toLocaleString();

      if (progress < 1) {
        requestAnimationFrame(update);
      } else {
        el.textContent = target.toLocaleString();
        // Trigger glow + confetti when done
        el.classList.add("glow");
        showRank(target);
        startConfetti();
      }
    }
    requestAnimationFrame(update);
  }

  function showRank(score) {
    const rank = getRank(score);
    document.getElementById("rankEmoji").textContent = rank.emoji;
    document.getElementById("rankLabel").textContent = rank.label;
    document.getElementById("rankSub").textContent = rank.sub;
    document.getElementById("rankBlock").classList.add("visible");
  }

  // Start animation on load
  window.addEventListener("load", () => {
    setTimeout(() => animateScore(finalScore, 1500), 400);
  });

  window.playAgain = function() {
    sessionStorage.removeItem("finalScore");
    window.location.href = "02_name.html";
  };

  window.goLeaderboard = function() {
    window.location.href = "05_leaderboard.html";
  };
</script>

<script>
  // Starfield
  const starfield = document.getElementById("starfield");
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    starfield.appendChild(s);
  }

  // Confetti
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const COLORS = ["#00FFAF", "#ffffff", "#00c98a", "#7fffdf", "#FFD700", "#FF6B6B"];
  let particles = [];
  let confettiRunning = false;

  function createParticle() {
    return {
      x: Math.random() * canvas.width,
      y: -10,
      size: Math.random() * 6 + 3,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      speedY: Math.random() * 3 + 2,
      speedX: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 8,
      opacity: 1,
      shape: Math.random() > 0.5 ? "rect" : "circle"
    };
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    if (p.shape === "rect") {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  let burstCount = 0;
  function confettiLoop() {
    if (!confettiRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (burstCount < 60) {
      for (let i = 0; i < 5; i++) particles.push(createParticle());
      burstCount++;
    }

    particles = particles.filter(p => p.opacity > 0);
    particles.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;
      if (p.y > canvas.height * 0.7) p.opacity -= 0.02;
      drawParticle(p);
    });

    if (particles.length > 0) {
      requestAnimationFrame(confettiLoop);
    } else {
      confettiRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  window.startConfetti = function() {
    burstCount = 0;
    particles = [];
    confettiRunning = true;
    confettiLoop();
  };
</script>

</body>
</html>
